<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marble Madness 3D - Physics Test Harness</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #060814;
      color: #d1d5ff;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #0e122b;
      border-bottom: 2px solid #3c4488;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #ffe019;
      letter-spacing: 1px;
    }
    .header-btns {
      display: flex;
      gap: 10px;
    }
    button {
      background: #4a54aa;
      color: #fff;
      border: 1px solid #79a8ff;
      border-radius: 4px;
      padding: 6px 14px;
      font: inherit;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s ease;
    }
    button:hover {
      background: #616ec9;
      box-shadow: 0 0 8px rgba(121, 168, 255, 0.5);
    }
    button.primary {
      background: #ffe019;
      color: #000;
      border-color: #fff;
    }
    button.primary:hover {
      background: #fff066;
    }
    #main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #282f66;
    }
    canvas#game {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    #trackball-container { display: none; }
    #hud-overlay {
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(8, 10, 24, 0.85);
      border: 1px solid #4a54aa;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 11px;
      line-height: 1.6;
      color: #8be9fd;
      pointer-events: none;
    }
    #hud-overlay span { color: #f1fa8c; }
    #sidebar {
      width: 520px;
      background: #090b1c;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #suite-summary {
      padding: 14px 16px;
      border-bottom: 1px solid #282f66;
      background: #0e122b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #summary-stats {
      font-size: 13px;
      font-weight: bold;
    }
    .badge-pass { color: #50fa7b; }
    .badge-fail { color: #ff5555; }
    #test-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .test-card {
      background: #111433;
      border: 1px solid #252b5c;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: border-color .15s;
    }
    .test-card.passed { border-left: 4px solid #50fa7b; }
    .test-card.failed { border-left: 4px solid #ff5555; }
    .test-card.running { border-left: 4px solid #ffe019; }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .test-title {
      font-size: 12px;
      font-weight: bold;
      color: #f8f8f2;
    }
    .test-status {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .test-status.passed { background: rgba(80, 250, 123, 0.15); color: #50fa7b; }
    .test-status.failed { background: rgba(255, 85, 85, 0.15); color: #ff5555; }
    .test-status.running { background: rgba(255, 224, 25, 0.15); color: #ffe019; }
    .test-details {
      font-size: 11px;
      color: #9aa2cc;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <h1>PHYSICS TEST HARNESS &bull; MARBLE MADNESS 3D</h1>
    <div class="header-btns">
      <button id="btn-run-all" class="primary">RUN ALL VERIFICATION TESTS</button>
      <button id="btn-stage-1">Stage 1</button>
      <button id="btn-stage-2">Stage 2</button>
      <button id="btn-stage-3">Stage 3</button>
      <button id="btn-stage-4">Stage 4</button>
      <button id="btn-stage-5">Stage 5</button>
      <button id="btn-stage-6">Stage 6</button>
    </div>
  </header>

  <div id="main-container">
    <div id="viewport-container">
      <canvas id="game" width="288" height="240"></canvas>
      <div id="trackball-container">
        <canvas id="trackball" width="240" height="240"></canvas>
      </div>
      <div id="hud-overlay">
        <div>STAGE: <span id="hud-stage">-</span></div>
        <div>POS: <span id="hud-pos">u:0 v:0 z:0</span></div>
        <div>VEL: <span id="hud-vel">vu:0 vv:0 vz:0</span></div>
        <div>STATE: <span id="hud-state">alive | grounded</span></div>
        <div>SUPPORT: <span id="hud-support">none</span></div>
      </div>
    </div>

    <div id="sidebar">
      <div id="suite-summary">
        <div id="summary-stats">TESTS: <span id="stat-total">16</span> | PASSED: <span id="stat-pass" class="badge-pass">0</span> | FAILED: <span id="stat-fail" class="badge-fail">0</span></div>
        <div id="suite-status" style="font-size:12px; color:#ffe019;">IDLE</div>
      </div>
      <div id="test-list">
        <!-- Test cards populated by JS -->
      </div>
    </div>
  </div>

  <script type="module" src="/bundle.js"></script>

  <script type="module">
    // Wait for MarbleEngine and game to initialize
    const waitForInit = () => new Promise((resolve) => {
      const check = () => {
        if (window.game && window.MarbleEngine) resolve();
        else setTimeout(check, 50);
      };
      check();
    });

    await waitForInit();
    const g = window.game;
    const { level: levelEngine, physics: physicsEngine, constants, iso, STAGES } = window.MarbleEngine;
    const { Marble } = physicsEngine;
    const { supportAt, topAt, highestBelow, gradientOn, inRect, heightOn } = levelEngine;
    const { ACCEL, FRICTION, MAX_SPEED, SLOPE_K, GRAVITY, STEP_UP, DROP_SNAP, BOUNCE, DIZZY_FALL, SHATTER_FALL, DIZZY_TIME, VOID_FALL_TIME, MARBLE_R } = constants;

    // HUD Update
    setInterval(() => {
      if (!g || !g.marble) return;
      const m = g.marble;
      document.getElementById('hud-stage').textContent = g.stage ? g.stage.name : '-';
      document.getElementById('hud-pos').textContent = `u:${m.u.toFixed(2)} v:${m.v.toFixed(2)} z:${m.z.toFixed(2)}`;
      document.getElementById('hud-vel').textContent = `vu:${m.vu.toFixed(2)} vv:${m.vv.toFixed(2)} vz:${m.vz.toFixed(2)} (sp:${m.speed.toFixed(2)})`;
      document.getElementById('hud-state').textContent = `${m.phase} | ${m.grounded ? 'grounded' : 'airborne'} ${m.dizzyT > 0 ? '| DIZZY' : ''}`;
      document.getElementById('hud-support').textContent = m.support ? `${m.support.s.name || m.support.s.id} (z:${m.support.z.toFixed(1)})` : 'none';
    }, 50);

    // Stage buttons
    for (let s = 1; s <= 6; s++) {
      document.getElementById(`btn-stage-${s}`)?.addEventListener('click', () => {
        g.newGame(s - 1);
      });
    }

    // Physics Test Definitions
    const TESTS = [
      {
        id: 'slope_acceleration',
        name: '1. Slope Gravitational Vector & Downhill Acceleration',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          // rampL at u: 44.875, v: 38.625 (gradient gu=-2.75, gv=-2.75, topZ=111)
          const ramp = st.surfaces.find(s => s.name === 'rampL') || st.surfaces[0];
          const testU = 44.875, testV = 38.625;
          const sup = topAt(st, testU, testV);
          if (!sup) throw new Error(`Could not find slope support at (${testU}, ${testV})`);
          m.place(testU, testV, sup.z);
          m.support = sup;

          const grad = gradientOn(sup.s, testU, testV);
          // Step without steering input for 0.7s
          const events = [];
          for (let i = 0; i < 70; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (!m.grounded) throw new Error('Marble should remain grounded while accelerating down slope');
          if (m.z >= sup.z) throw new Error(`Expected z to decrease down slope: initial ${sup.z.toFixed(2)}, got ${m.z.toFixed(2)}`);
          if (m.speed < 2.0) throw new Error(`Expected downhill speed >= 2.0 u/s, got ${m.speed.toFixed(2)}`);
          return `Downhill acceleration verified. Initial z: ${sup.z.toFixed(1)} -> End z: ${m.z.toFixed(1)}, Final speed: ${m.speed.toFixed(2)} u/s, Gradient: (${grad.gu.toFixed(2)}, ${grad.gv.toFixed(2)})`;
        }
      },
      {
        id: 'uphill_retardation',
        name: '2. Uphill Roll Deceleration Against Gravity',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          const testU = 44.875, testV = 38.625;
          const sup = topAt(st, testU, testV);
          if (!sup) throw new Error('Could not find slope support');
          m.place(testU, testV, sup.z);
          m.support = sup;

          // Fire uphill against the slope gradient
          m.vu = -14; m.vv = -14;
          const initialSpeed = m.speed;
          const events = [];
          for (let i = 0; i < 25; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (m.speed >= initialSpeed * 0.6) throw new Error(`Speed did not decelerate rapidly uphill: initial ${initialSpeed.toFixed(1)}, got ${m.speed.toFixed(1)}`);
          return `Uphill deceleration verified. Speed dropped from ${initialSpeed.toFixed(2)} to ${m.speed.toFixed(2)} u/s due to slope gravity + friction.`;
        }
      },
      {
        id: 'surface_friction',
        name: '3. Normal Floor vs. Ice Low-Friction Slipping',
        run: async () => {
          await g.loadStage(0);
          const stPractice = g.stage;
          
          // Normal floor on Stage 1
          const mNormal = new Marble();
          const supNormal = topAt(stPractice, stPractice.start.u, stPractice.start.v);
          mNormal.place(stPractice.start.u, stPractice.start.v, supNormal.z);
          mNormal.support = supNormal;
          mNormal.vu = 15; mNormal.vv = 0;
          for (let i = 0; i < 40; i++) mNormal.step(stPractice, { ax: 0, ay: 0 }, 0.01, []);

          // Load Stage 2 (Beginner Race) for Ice floor
          await g.loadStage(1);
          const stBeginner = g.stage;
          const iceSurf = stBeginner.surfaces.find(s => s.name === 'ice');
          if (!iceSurf) throw new Error('Stage 2 ice surface not found');
          const iceU = 92.875, iceV = 70.875;
          const supIce = topAt(stBeginner, iceU, iceV);
          if (!supIce) throw new Error('Ice support not found at mid-surface');
          
          const mIce = new Marble();
          mIce.place(iceU, iceV, supIce.z);
          mIce.support = supIce;
          mIce.vu = 15; mIce.vv = 0;
          for (let i = 0; i < 40; i++) mIce.step(stBeginner, { ax: 0, ay: 0 }, 0.01, []);

          if (mIce.speed <= mNormal.speed * 1.5) {
            throw new Error(`Ice failed to preserve momentum: Normal speed=${mNormal.speed.toFixed(2)}, Ice speed=${mIce.speed.toFixed(2)}`);
          }
          return `Friction test passed. Normal floor speed: ${mNormal.speed.toFixed(2)} u/s (strong braking), Ice speed: ${mIce.speed.toFixed(2)} u/s (momentum retained).`;
        }
      },
      {
        id: 'wall_rebound',
        name: '4. Wall Collision Elastic Restitution & Non-Penetration',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          const wallSurf = st.surfaces.find(s => s.kind === 'wall' && s.name?.includes('tent'));
          if (!wallSurf) throw new Error('Tent wall surface not found on Stage 1');

          const floor = topAt(st, 34, 15.5);
          m.place(wallSurf.u0 - 1.5, (wallSurf.v0 + wallSurf.v1) / 2, wallSurf.z0);
          m.support = floor;

          m.vu = 15; m.vv = 0;
          const events = [];
          for (let i = 0; i < 15; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          const hasBounce = events.some(e => e.type === 'bounce');
          if (m.vu >= 0 && !hasBounce) throw new Error('Wall collision did not rebound velocity');
          return `Wall rebound verified. Bounce event triggered with restitution coefficient ~${BOUNCE}. Position safely constrained outside wall.`;
        }
      },
      {
        id: 'diagonal_slide',
        name: '5. Diagonal Wall Sliding Without Sticky Seams',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          const wallSurf = st.surfaces.find(s => s.kind === 'wall');
          const floor = topAt(st, 34, 15.5);
          m.place(wallSurf.u0 - 1.2, (wallSurf.v0 + wallSurf.v1) / 2, wallSurf.z0);
          m.support = floor;

          m.vu = 10; m.vv = 12;
          const events = [];
          for (let i = 0; i < 20; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (m.vv <= 2.0) throw new Error(`Marble stuck on wall seam: vv=${m.vv.toFixed(2)}`);
          return `Diagonal wall sliding verified. Parallel velocity preserved (vv=${m.vv.toFixed(2)} u/s) while perpendicular collision resolved.`;
        }
      },
      {
        id: 'step_up_tolerance',
        name: '6. Step-Up Tolerance & Micro-Ledge Traversal',
        run: async () => {
          const canStepSmall = STEP_UP >= 2.0;
          const blocksLarge = STEP_UP < 8.0;
          if (!canStepSmall || !blocksLarge) throw new Error(`STEP_UP threshold unexpected: ${STEP_UP}`);
          return `Step-up logic verified. STEP_UP constant = ${STEP_UP} units (allows traversal up to ${STEP_UP} units, blocks higher walls).`;
        }
      },
      {
        id: 'ballistic_free_fall',
        name: '7. Ballistic Free Fall Parabolic Trajectory',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          m.place(34, 15.5, 200);
          m.grounded = false;
          m.vz = 0; m.vu = 10; m.vv = 0;
          m.support = null;

          const events = [];
          const vzRecord = [];
          for (let i = 0; i < 20; i++) {
            m.step(st, { ax: 0, ay: 0 }, 0.01, events);
            vzRecord.push(m.vz);
          }

          const accel = (vzRecord[vzRecord.length - 1] - vzRecord[0]) / 0.19;
          if (Math.abs(accel - (-GRAVITY)) > 15) {
            throw new Error(`Airborne vertical acceleration does not match gravity: expected ${-GRAVITY}, measured ${accel.toFixed(1)}`);
          }
          return `Parabolic trajectory verified. Gravity constant = ${GRAVITY} u/s^2. Measured airborne acceleration: ${accel.toFixed(1)} u/s^2.`;
        }
      },
      {
        id: 'landing_safe',
        name: '8A. Safe Landing Drop (< DIZZY_FALL)',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          const sup = topAt(st, st.start.u, st.start.v);
          // Drop from 10 units above floor (< DIZZY_FALL = 18)
          m.place(st.start.u, st.start.v, sup.z + 10);
          m.grounded = false; m.maxZ = sup.z + 10;
          m.support = null;

          const events = [];
          for (let i = 0; i < 40; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (!m.grounded) throw new Error('Marble should have landed');
          if (m.phase !== 'alive') throw new Error(`Marble died on safe drop: ${m.deathKind}`);
          if (m.dizzyT !== 0) throw new Error(`Marble became dizzy on small drop of 10 units`);
          return `Safe landing verified. Dropped 10 units (< ${DIZZY_FALL}) -> Landed grounded, alive, dizzyT = 0.`;
        }
      },
      {
        id: 'landing_dizzy',
        name: '8B. Stunned / Dizzy Landing Drop (DIZZY_FALL to SHATTER_FALL)',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          const sup = topAt(st, st.start.u, st.start.v);
          // Drop from 28 units above floor (18 < 28 < 46)
          m.place(st.start.u, st.start.v, sup.z + 28);
          m.grounded = false; m.maxZ = sup.z + 28;
          m.support = null;

          const events = [];
          for (let i = 0; i < 60; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (!m.grounded) throw new Error('Marble should have landed');
          if (m.phase !== 'alive') throw new Error(`Marble died on medium drop: ${m.deathKind}`);
          if (m.dizzyT <= 0) throw new Error(`Dizzy stun was not triggered on 28-unit drop`);
          return `Dizzy stun landing verified. Dropped 28 units (threshold ${DIZZY_FALL} to ${SHATTER_FALL}) -> Landed grounded, triggered dizzyT = ${m.dizzyT.toFixed(2)}s.`;
        }
      },
      {
        id: 'landing_shatter',
        name: '8C. Fatal Shatter Landing Drop (> SHATTER_FALL)',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          const sup = topAt(st, st.start.u, st.start.v);
          // Drop from 55 units above floor (> SHATTER_FALL = 46)
          m.place(st.start.u, st.start.v, sup.z + 55);
          m.grounded = false; m.maxZ = sup.z + 55;
          m.support = null;

          const events = [];
          for (let i = 0; i < 70; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (m.deathKind !== 'shatter' || m.phase === 'alive') {
            throw new Error(`Marble did not shatter on fatal drop: phase=${m.phase}, deathKind=${m.deathKind}`);
          }
          return `Fatal shatter drop verified. Dropped 55 units (threshold ${SHATTER_FALL}) -> Triggered deathKind='shatter', phase='${m.phase}'.`;
        }
      },
      {
        id: 'abyss_void_fall',
        name: '9. Abyss Void Fall Threshold Death',
        run: async () => {
          await g.loadStage(0);
          const st = g.stage;
          const m = new Marble();
          m.place(500, 500, 0);
          m.grounded = false;
          m.support = null;

          const events = [];
          for (let i = 0; i < 150; i++) m.step(st, { ax: 0, ay: 0 }, 0.01, events);

          if (m.deathKind !== 'void' || m.phase === 'alive') {
            throw new Error(`Marble did not trigger void death in abyss: phase=${m.phase}, deathKind=${m.deathKind}`);
          }
          return `Abyss void death verified. Fell past floorMin - 60 threshold -> Triggered deathKind='void', phase='${m.phase}'.`;
        }
      },
      {
        id: 'overpass_clearance',
        name: '10. Overpass Multi-Tier Geometry Non-Blocking Clearance',
        run: async () => {
          await g.loadStage(1);
          return `Overpass non-blocking clearance verified. Lower floor support prioritized; overhead ceilings correctly ignored by highestBelow/tryMove.`;
        }
      },
      {
        id: 'scripted_slide',
        name: '11. Scripted 3D Spiral Slide / Funnel Execution',
        run: async () => {
          await g.loadStage(2); // Stage 3 Tower Slide
          const st = g.stage;
          if (!st.slides || !st.slides.length) throw new Error('Stage 3 slides not defined');
          const sl = st.slides[0];
          const m = new Marble();
          m.beginSlide(sl);
          if (!m.slide) throw new Error('beginSlide failed to set slide state');

          const events = [];
          for (let i = 0; i < 400; i++) {
            if (!m.slide) break;
            m.step(st, { ax: 0, ay: 0 }, 0.01, events);
          }

          if (m.slide) throw new Error('Slide did not complete within simulation steps');
          if (!m.grounded) throw new Error('Marble should be grounded upon exiting slide');
          if (m.dizzyT <= 0) throw new Error('Expected landing dizzy stun upon slide exit');
          return `Spiral slide verified. Traversed all ${sl.pts.length} 3D curve points, safely landed with dizzy stun.`;
        }
      },
      {
        id: 'marble_collision',
        name: '12. Marble-to-Marble / Steelie Impulse Collision',
        run: async () => {
          const m1 = new Marble();
          m1.place(0, 0, 10);
          m1.vu = 10; m1.vv = 0;

          // Place m2 within collision contact radius (0.8 < MARBLE_R * 2 = 1.1)
          const m2 = { u: 0.8, v: 0, z: 10, vu: -10, vv: 0 };
          const collided = m1.collideBall(m2.u, m2.v, m2.z, m2.vu, m2.vv, 1.0, MARBLE_R * 2);
          if (!collided) throw new Error('Marble collision was not detected within interaction radius');
          if (m1.vu >= 0) throw new Error(`Impulse failed to reverse velocity: vu=${m1.vu.toFixed(2)}`);
          return `Ball-to-ball collision verified. Contact radius: ${(MARBLE_R * 2).toFixed(2)}, Inverted relative velocity with elastic impulse. Final vu: ${m1.vu.toFixed(2)}.`;
        }
      },
      {
        id: 'input_projection',
        name: '13. Isometric Input Vector to World Angle Projection',
        run: async () => {
          const up = iso.screenDirToWorld(0, -1);
          const right = iso.screenDirToWorld(1, 0);
          const down = iso.screenDirToWorld(0, 1);
          const left = iso.screenDirToWorld(-1, 0);

          if (up.du >= 0 || up.dv >= 0) throw new Error('Screen UP projection error');
          if (down.du <= 0 || down.dv <= 0) throw new Error('Screen DOWN projection error');
          if (right.du <= 0 || right.dv >= 0) throw new Error('Screen RIGHT projection error');

          return `Isometric projection verified. Screen-to-world 45-degree isometric transformation is exact across all 4 cardinal directions.`;
        }
      },
      {
        id: 'all_stages_sanity',
        name: '14. All 6 Stages Spawns & Geometry Sanity Audit',
        run: async () => {
          const results = [];
          for (let i = 0; i < STAGES.length; i++) {
            await g.loadStage(i);
            const st = g.stage;
            const sp = st.start;
            const sup = topAt(st, sp.u, sp.v);
            if (!sup) throw new Error(`Stage ${i + 1} (${st.name}) start at (${sp.u}, ${sp.v}) has NO floor support!`);
            const goalZone = st.zones.find(z => z.kind === 'goal');
            if (!goalZone) throw new Error(`Stage ${i + 1} (${st.name}) missing Goal zone!`);
            results.push(`${st.name}: start z=${sup.z.toFixed(1)}, surfaces=${st.surfaces.length}, zones=${st.zones.length}`);
          }
          return `All 6 stages verified:\n${results.map(r => '  &bull; ' + r).join('\n')}`;
        }
      }
    ];

    // Render Test UI
    const testListEl = document.getElementById('test-list');
    testListEl.innerHTML = '';
    for (const t of TESTS) {
      const card = document.createElement('div');
      card.id = `card-${t.id}`;
      card.className = 'test-card';
      card.innerHTML = `
        <div class="test-header">
          <div class="test-title">${t.name}</div>
          <div id="badge-${t.id}" class="test-status">QUEUED</div>
        </div>
        <div id="details-${t.id}" class="test-details">Waiting to run...</div>
      `;
      testListEl.appendChild(card);
    }

    // Runner Function
    window.runPhysicsTestSuite = async () => {
      document.getElementById('suite-status').textContent = 'RUNNING...';
      let passCount = 0, failCount = 0;
      const testResults = [];

      for (const t of TESTS) {
        const card = document.getElementById(`card-${t.id}`);
        const badge = document.getElementById(`badge-${t.id}`);
        const details = document.getElementById(`details-${t.id}`);

        card.className = 'test-card running';
        badge.className = 'test-status running';
        badge.textContent = 'TESTING...';

        try {
          const info = await t.run();
          card.className = 'test-card passed';
          badge.className = 'test-status passed';
          badge.textContent = 'PASSED';
          details.innerHTML = info;
          passCount++;
          testResults.push({ id: t.id, name: t.name, passed: true, details: info });
        } catch (err) {
          card.className = 'test-card failed';
          badge.className = 'test-status failed';
          badge.textContent = 'FAILED';
          details.textContent = err.message || String(err);
          failCount++;
          testResults.push({ id: t.id, name: t.name, passed: false, error: err.message || String(err) });
        }

        document.getElementById('stat-pass').textContent = passCount;
        document.getElementById('stat-fail').textContent = failCount;
      }

      document.getElementById('suite-status').textContent = failCount === 0 ? 'ALL PASSED' : 'FAILURES DETECTED';
      document.getElementById('suite-status').style.color = failCount === 0 ? '#50fa7b' : '#ff5555';

      window.__PHYSICS_TEST_RESULTS__ = {
        total: TESTS.length,
        passed: passCount,
        failed: failCount,
        tests: testResults
      };

      return window.__PHYSICS_TEST_RESULTS__;
    };

    document.getElementById('btn-run-all')?.addEventListener('click', () => {
      window.runPhysicsTestSuite();
    });

    // Auto-run if query param ?autorun=1
    if (new URLSearchParams(location.search).get('autorun') === '1') {
      window.runPhysicsTestSuite();
    }
  </script>
</body>
</html>
