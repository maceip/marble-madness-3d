<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Marble Madness" />
  <meta name="application-name" content="Marble Madness" />
  <meta name="msapplication-TileColor" content="#000000" />
  <title>Marble Madness</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Courier New", monospace; color: #cfd2ff; }
    canvas#game {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      cursor: crosshair;
    }
    #settings {
      position: fixed;
      left: max(14px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      font-size: 11px;
      color: #9aa0ff;
      background: rgba(10, 12, 24, 0.75);
      border: 1px solid rgba(74, 80, 168, 0.4);
      border-radius: 4px;
      padding: 4px 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      opacity: .4;
      z-index: 50;
      transition: opacity .15s ease;
    }
    #settings:hover { opacity: 1; }
    #settings input[type="range"] { width: 80px; }
    #settings input[type="checkbox"] { width: auto; }

    /* 3D Bowling Ball Trackball Dock (Bottom Right on Mobile & Desktop) */
    #trackball-container {
      position: fixed;
      bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 25;
    }
    #trackball {
      width: 160px;
      height: 160px;
      cursor: grab;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85), inset 0 0 16px rgba(0,0,0,0.9);
      touch-action: none;
    }
    #ui-root {
      position: fixed; inset: 0; z-index: 30; pointer-events: auto;
      display: flex; flex-direction: column;
    }
    #ui-root[hidden] { display: none !important; }
    #agent-console {
      position: fixed; inset: 0; z-index: 200; overflow: hidden;
      box-sizing: border-box; padding: clamp(22px, 4vh, 48px) clamp(24px, 4vw, 64px);
      background:
        radial-gradient(circle at 23% 52%, rgba(22, 81, 170, .22), transparent 25%),
        linear-gradient(rgba(25, 103, 196, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(25, 103, 196, .05) 1px, transparent 1px), #020407;
      background-size: auto, 24px 24px, 24px 24px, auto;
      display: grid; grid-template-rows: auto 1fr auto; gap: 22px;
      color: #8fd8ff;
    }
    #agent-console[hidden] { display: none !important; }
    .agent-console-head, .agent-console-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      min-width: 0;
    }
    .agent-console-head { padding-bottom: 14px; border-bottom: 3px solid #134f8c; }
    .agent-console-foot { padding-top: 12px; border-top: 2px solid #102b49; }
    .agent-rig {
      position: relative; min-height: 0; display: grid;
      grid-template-columns: minmax(270px, 30%) minmax(210px, 22%) minmax(390px, 1fr);
      align-items: center; gap: clamp(18px, 3vw, 52px);
    }
    .agent-ball-bay { position: relative; height: 100%; min-height: 430px; }
    .agent-ball-ring {
      position: absolute; left: 50%; top: 50%; width: min(27vw, 330px); aspect-ratio: 1;
      transform: translate(-50%, -50%); border-radius: 50%;
      border: 4px solid #174b8d; box-shadow: 0 0 35px #087be866, inset 0 0 35px #087be833;
    }
    .agent-ball-ring::before, .agent-ball-ring::after {
      content: ""; position: absolute; inset: 13%; border: 2px dashed #2b87de; border-radius: 50%; opacity: .65;
    }
    .agent-ball-ring::after { inset: -18px; border-style: solid; border-color: #071d36; }
    .agent-ball-caption { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); white-space: nowrap; }
    .agent-flux {
      position: relative; width: 100%; max-width: 290px; aspect-ratio: .72; justify-self: center;
      filter: drop-shadow(0 0 12px rgba(45, 153, 255, .55));
    }
    .agent-flux svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .agent-flux-arm { stroke: #56bcff; stroke-width: 16; stroke-linecap: round; fill: none; }
    .agent-flux-arm-core { stroke: #d9f5ff; stroke-width: 4; stroke-linecap: round; fill: none; }
    .agent-flux-node { fill: #071a33; stroke: #ffe34f; stroke-width: 6; }
    #agent-flux-core { fill: #fffbd1; stroke: #58c6ff; stroke-width: 8; }
    .agent-flux-label { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); white-space: nowrap; }
    .agent-conduit {
      position: absolute; z-index: -1; left: 20%; right: 35%; top: 50%; height: 10px;
      transform: translateY(-50%); border: 2px solid #1d73b8; border-radius: 999px;
      background: #03101d; box-shadow: 0 0 18px #149cff55;
    }
    .agent-energy-dot {
      position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; border-radius: 50%;
      background: #fff770; box-shadow: 0 0 8px #fff, 0 0 28px #38bfff, 0 0 54px #168cff;
      opacity: 0; transform: translate(-50%, -50%);
    }
    #agent-console.pulse-to-ball .agent-energy-dot { animation: agentPulseLeft 520ms ease-out; }
    #agent-console.pulse-to-terminal .agent-energy-dot { animation: agentPulseRight 520ms ease-out; }
    #agent-console.pulse-spin #agent-flux-core { animation: fluxCore 480ms steps(2, end); }
    @keyframes agentPulseLeft { 0% { left: 100%; opacity: 0; } 15% { opacity: 1; } 100% { left: 0; opacity: 0; } }
    @keyframes agentPulseRight { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
    @keyframes fluxCore { 0%, 100% { fill: #fffbd1; } 35% { fill: #4cf6ff; filter: drop-shadow(0 0 22px #fff); } 70% { fill: #ffea38; } }
    .agent-terminal {
      height: min(68vh, 650px); min-height: 410px; display: grid; grid-template-rows: auto 1fr;
      overflow: hidden; background: #000; border: 5px double #317fc7; border-radius: 8px;
      box-shadow: 0 0 0 4px #01060d, 0 0 38px #087be844, inset 0 0 28px #06192d;
    }
    .agent-terminal-bar {
      min-height: 38px; padding: 0 14px; display: flex; align-items: center; gap: 10px;
      background: #07111e; border-bottom: 2px solid #184d7d;
    }
    .agent-led { width: 11px; height: 11px; border-radius: 50%; background: #18324d; box-shadow: inset 0 0 3px #000; }
    .agent-led.on { background: #52e7ff; box-shadow: 0 0 12px #36bdff; }
    .agent-terminal-title { margin-left: auto; color: #4da4d9; font: 900 15px/1 "Courier New", monospace; letter-spacing: 2px; }
    #agent-terminal-log {
      overflow: hidden; padding: 18px 16px; display: flex; flex-direction: column; justify-content: flex-end;
      gap: 5px; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(57, 160, 255, .035) 3px 4px);
    }
    .agent-log-line { min-height: 16px; flex: 0 0 auto; white-space: nowrap; }
    .agent-log-line canvas { display: block; max-width: 100%; }
    body.agent-console-active #game, body.agent-console-active #ui-root,
    body.agent-console-active #ui-fx, body.agent-console-active #settings,
    body.agent-console-active #android-app-prompt, body.agent-console-active #desktop-controls-help { display: none !important; }
    body.agent-console-active #trackball-container {
      display: flex !important; z-index: 220; left: 15%; right: auto; top: 50%; bottom: auto;
      transform: translate(-50%, -50%);
    }
    body.agent-console-active #trackball { width: min(25vw, 300px); height: min(25vw, 300px); cursor: default; }
    body.agent-console-active #trackball-label { display: none; }
    @media (max-width: 900px), (pointer: coarse) {
      #agent-console { display: none !important; }
    }
    #ui-fx {
      /* Celebration marbles remain visible around the tally, but never paint over
         the score text or controls. #ui-root owns the readable foreground. */
      position: fixed; inset: 0; z-index: 29; pointer-events: none;
      width: 100vw; height: 100dvh;
    }
    #ui-fx[hidden] { display: none !important; }
    .ui-screen, #ui-title, #ui-menu, #ui-name, #ui-connect, #ui-congrats, #ui-rematch {
      pointer-events: auto;
      position: absolute; inset: 0;
      z-index: 2;
      display: flex; flex-direction: column;
      align-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 72px max(12px, env(safe-area-inset-left));
      box-sizing: border-box;
      width: 100%;
      overflow-x: hidden; overflow-y: auto;
    }
    #ui-title[hidden], #ui-menu[hidden], #ui-name[hidden], #ui-connect[hidden],
    #ui-congrats[hidden], #ui-rematch[hidden] { display: none !important; }

    .ui-tap {
      cursor: pointer; appearance: none; -webkit-appearance: none;
      transition: transform 90ms ease, filter 90ms ease, box-shadow 90ms ease;
      transform-origin: center;
      touch-action: manipulation;
    }
    .ui-tap:hover { filter: brightness(1.12); }
    .ui-tap:active, .ui-tap.pressed {
      transform: translateY(5px) scale(0.96);
      filter: brightness(0.82);
    }
    .ui-tap:focus-visible { outline: 2px solid #ffe019; outline-offset: 2px; }

    #android-app-prompt {
      position: fixed; z-index: 90;
      left: max(8px, env(safe-area-inset-left));
      right: max(8px, env(safe-area-inset-right));
      bottom: max(58px, calc(env(safe-area-inset-bottom) + 54px));
      display: flex; justify-content: center; pointer-events: none;
    }
    #android-app-prompt[hidden] { display: none !important; }
    #desktop-controls-help {
      position: fixed; inset: 0; z-index: 180;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; background: rgba(0, 0, 0, .88);
    }
    #desktop-controls-help[hidden] { display: none !important; }
    .desktop-controls-card {
      width: min(92vw, 610px); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 30px 26px 24px; background: #000;
      border: 6px double #4ec4ff; border-radius: 12px;
      box-shadow: 0 0 0 4px #000, 0 20px 60px rgba(0, 0, 0, .95);
    }
    .desktop-controls-steps { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    #desktop-controls-alt { margin-top: 4px; }
    #desktop-controls-dismiss {
      min-width: 290px; min-height: 54px; padding: 12px 18px;
      background: #ffd23f; border: 3px solid #ffe89a; border-radius: 8px;
    }
    .android-app-card {
      pointer-events: auto; width: min(100%, 540px); min-height: 78px; box-sizing: border-box;
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
      padding: 8px; background: rgba(2, 4, 10, .96);
      border: 3px double #4ec4ff; border-radius: 8px;
      box-shadow: 0 0 0 2px #000, 0 8px 24px rgba(0, 0, 0, .9);
    }
    .android-app-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
    .android-app-benefits { display: flex; flex-wrap: wrap; gap: 3px; }
    .android-app-benefit {
      display: flex; align-items: center; min-height: 17px; padding: 2px 4px;
      border: 1px solid #293a6b; border-radius: 3px; background: #090d1a;
    }
    #android-app-pwa-note { opacity: .82; }
    .android-app-actions { display: flex; align-items: center; gap: 5px; }
    .android-app-actions > * {
      min-width: 0; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      padding: 7px 6px; border-radius: 5px; text-decoration: none;
    }
    #android-app-open { min-width: 92px; min-height: 42px; background: #ffd23f; border: 2px solid #ffe89a; }
    #android-app-dismiss { width: 30px; height: 30px; padding: 3px; background: #111524; border: 2px solid #4a50a8; }
    @media (max-width: 390px) {
      .android-app-card { gap: 5px; padding: 5px 6px; }
      #android-app-open { min-width: 78px; }
      #android-app-dismiss { width: 28px; height: 28px; }
    }

    .ui-spread {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; flex-shrink: 0; min-height: 18px; margin-bottom: 2px;
    }
    .ui-spread-letter { flex: 1; display: flex; justify-content: center; }
    .ui-spread-gap { flex: 0.55; }
    #ui-presents { margin-bottom: 8px; }
    .ui-logo {
      width: min(72vw, 620px); max-width: 100%; height: auto;
      image-rendering: pixelated; image-rendering: crisp-edges;
      margin: 4px 0 14px;
    }
    .ui-lb {
      width: min(94vw, 680px);
      border: 6px double #4ec4ff;
      border-radius: 16px;
      padding: 10px 8px 6px;
      box-sizing: border-box;
      background: #000;
      position: relative;
      z-index: 2;
    }
    .ui-lb-head, .ui-lb-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1.05fr) minmax(0, 1.1fr);
      align-items: center;
      gap: 0;
    }
    .ui-lb-head {
      padding: 6px 7px;
      border-bottom: 2px solid #4ec4ff;
    }
    .ui-lb-head > :first-child { grid-column: 2; justify-self: start; }
    .ui-lb-head > :last-child { grid-column: 3; justify-self: start; padding-left: 12px; }
    .ui-lb-row {
      min-height: 27px; padding: 4px 7px;
      border-bottom: 1px dotted #3a8eb8;
    }
    .ui-lb-row:last-child { border-bottom: 0; }
    .ui-lb-name { padding-right: 10px; border-right: 2px dotted #4ec4ff; min-width: 0; display: flex; align-items: center; align-self: stretch; }
    .ui-lb-name.you canvas { filter: drop-shadow(0 1px 0 #4ec4ff); }
    .ui-lb-intel { padding-left: 12px; }
    #ui-press-start, #ui-menu-press, #ui-name-start {
      display: flex; justify-content: center; align-items: center;
      background: none; border: 0; padding: 14px 20px; margin-top: 10px;
    }
    .ui-foot {
      flex-shrink: 0; display: flex; justify-content: center; align-items: center;
      padding-top: 10px; min-height: 56px; margin-top: auto;
    }
    .ui-foot img { height: 44px; width: auto; image-rendering: pixelated; display: block; }
    #ui-menu { justify-content: flex-start; gap: 12px; background: #000; padding-top: max(28px, env(safe-area-inset-top)); }
    .ui-logo-menu { width: min(82vw, 520px); margin-bottom: clamp(42px, 10vh, 90px); }
    .ui-modes { display: flex; flex-direction: column; gap: 14px; width: min(76vw, 620px); }
    .ui-mode {
      display: flex; align-items: center; gap: 16px;
      background: transparent; border: 0; color: inherit;
      padding: 5px 8px; text-align: left; width: 100%;
    }
    .ui-mode-col { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .ui-mark { width: 34px; flex-shrink: 0; display: flex; justify-content: center; }
    .ui-mode-marble { width: 32px; height: 32px; image-rendering: pixelated; }
    #ui-menu-agent { margin-top: clamp(44px, 9vh, 80px); }
    #ui-menu-press { margin-top: clamp(38px, 8vh, 72px); }

    #ui-name { justify-content: flex-start; gap: 8px; }
    .ui-oauth-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap; width: min(96vw, 820px); margin: 6px 0 8px;
    }
    #ui-oauth-hint { margin-top: 8px; }
    .ui-oauth {
      width: min(42vw, 260px); height: 52px; border: 2px solid #394258; border-radius: 8px;
      background: #05070f; color: #fff; display: flex; align-items: center; justify-content: center;
      gap: 9px;
    }
    .ui-oauth.on { border-color: #ffe019; box-shadow: 0 0 0 2px #ffe019; }
    .ui-oauth svg { width: 22px; height: 22px; fill: #fff; }
    #ui-keys {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px; width: min(96vw, 720px); flex: 0 0 auto; min-height: 0;
      grid-auto-rows: clamp(40px, 6.2vh, 54px); align-content: start;
    }
    .ui-key {
      position: relative; min-height: 48px; height: 100%;
      background: #111524; border: 2px solid #272f48; border-radius: 8px;
      color: #fff; display: flex; align-items: center; justify-content: center;
      padding: 4px;
    }
    .ui-key.on { border-color: #ffe019; background: #243054; }
    .ui-key-marble {
      position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; image-rendering: pixelated; pointer-events: none;
      opacity: 0;
    }
    .ui-key.on .ui-key-marble { opacity: 1; }
    #ui-name-val {
      width: min(88vw, 540px); min-height: 44px; display: flex; justify-content: center; align-items: center;
      margin: 8px 0; border: 2px solid #ffe019; border-radius: 8px;
    }
    #ui-name-start {
      width: min(68vw, 360px); background: #ffd23f; border: 2px solid #ffe89a;
      border-radius: 8px; min-height: 44px; margin-top: auto;
    }
    #ui-name-start.dim { opacity: 0.45; }

    #ui-connect { justify-content: center; gap: 14px; }
    #ui-copy {
      position: absolute; top: -34px; right: 12px;
      width: 222px; height: 126px; padding: 0; z-index: 5;
      border: 0; background: transparent; color: inherit;
      display: block;
    }
    .ui-copy-callout {
      position: absolute; top: 0; right: 0;
      min-width: 208px; min-height: 38px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      padding: 7px 10px; background: #000;
      border: 3px solid #4ec4ff; border-radius: 9px;
    }
    .ui-copy-callout::before, .ui-copy-callout::after {
      content: ''; position: absolute; top: 50%; width: 14px; height: 3px;
      background: #4ec4ff;
    }
    .ui-copy-callout::before { left: -14px; }
    .ui-copy-callout::after { right: -14px; }
    .ui-copy-icon {
      position: absolute; width: 78px; height: 78px; right: 61px; top: 45px;
      object-fit: contain; image-rendering: pixelated; pointer-events: none;
    }
    .ui-connect-box {
      position: relative;
      width: min(94vw, 900px);
      border: 3px solid #4ec4ff;
      border-radius: 16px;
      padding: 56px 18px 20px;
      box-sizing: border-box;
      text-align: center;
      overflow: visible;
    }
    .ui-speech {
      position: absolute; top: -14px; left: 18px;
      background: #000; border: 2px solid #4ec4ff; border-radius: 8px;
      padding: 4px 8px;
    }
    #ui-connect-h {
      position: absolute; top: -72px; left: 50%; transform: translateX(-50%);
      display: flex; justify-content: center; padding: 5px 12px;
      background: #000; white-space: nowrap; z-index: 4;
    }
    #ui-connect-body { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
    .ui-connect-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 0; }
    .ui-marble-row {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin-top: 22px; color: #ffe019; letter-spacing: 6px; font-size: 18px;
    }
    #ui-connect-marble { width: 56px; height: 56px; image-rendering: pixelated; }
    #ui-connect-wait { margin-top: 8px; }
    .ui-cradle-loader {
      position: relative; width: min(64vw, 280px); aspect-ratio: 640 / 409;
      margin: -4px auto 0; overflow: visible; flex: 0 0 auto;
      filter: drop-shadow(0 0 5px rgba(78, 196, 255, .22));
    }
    .ui-cradle-loader img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      pointer-events: none; user-select: none;
    }
    .ui-cradle-pendulum {
      position: absolute; top: 14.5%; width: 8%; height: 53%;
      transform-origin: 50% 0; z-index: 2;
    }
    .ui-cradle-pendulum::before, .ui-cradle-pendulum::after {
      content: ''; position: absolute; top: 0; width: 1px; height: 88%;
      background: linear-gradient(90deg, #333, #fff, #555);
      transform-origin: 50% 0;
    }
    .ui-cradle-pendulum::before { left: 43%; transform: rotate(2deg); }
    .ui-cradle-pendulum::after { right: 43%; transform: rotate(-2deg); }
    .ui-cradle-ball {
      position: absolute; left: 50%; bottom: 0; width: 94%; aspect-ratio: 1;
      transform: translateX(-50%); border-radius: 50%; box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.85);
    }
    .ui-cradle-left { left: 23.3%; animation: ui-cradle-left 2.2s linear infinite; }
    .ui-cradle-right { left: 66%; animation: ui-cradle-right 2.2s linear infinite; }
    .ui-cradle-left .ui-cradle-ball {
      background: radial-gradient(circle at 34% 25%, #fff 0 5%, #4ec4ff 8%, #075cff 25%, #001d92 58%, #000728 78%);
      box-shadow: inset -4px -5px 5px #000729, 0 0 4px #168cff;
    }
    .ui-cradle-right .ui-cradle-ball {
      background: radial-gradient(circle at 34% 25%, #fff 0 5%, #ff8a8a 8%, #ff001e 25%, #8f000c 58%, #210006 78%);
      box-shadow: inset -4px -5px 5px #210006, 0 0 4px #ff1838;
    }
    @keyframes ui-cradle-left {
      0%, 20% { opacity: 0; transform: rotate(0deg); }
      20.01% { opacity: 1; transform: rotate(0deg); }
      40% { opacity: 1; transform: rotate(-29deg); }
      60% { opacity: 1; transform: rotate(0deg); }
      60.01%, 100% { opacity: 0; transform: rotate(0deg); }
    }
    @keyframes ui-cradle-right {
      0% { opacity: 1; transform: rotate(29deg); }
      20% { opacity: 1; transform: rotate(0deg); }
      20.01%, 60% { opacity: 0; transform: rotate(0deg); }
      60.01% { opacity: 1; transform: rotate(0deg); }
      80% { opacity: 1; transform: rotate(29deg); }
      100% { opacity: 1; transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ui-cradle-left { animation: none; opacity: 0; }
      .ui-cradle-right { animation: none; opacity: 1; transform: rotate(24deg); }
    }
    #ui-chrome-ai { display: none !important; }
    #ui-agent-teaser {
      position: relative; width: min(90vw, 480px); height: 142px;
      margin-top: -2px; display: flex; align-items: flex-end; justify-content: center;
      animation: ui-portal-rise .72s steps(7, end) both;
    }
    #ui-agent-teaser[hidden] { display: none !important; }
    .ui-portal {
      position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
      width: 158px; height: 28px; border-radius: 50%;
      border: 5px solid #26d95b; box-shadow: 0 0 0 4px #165cff, 0 0 22px #25ddff;
      background: radial-gradient(ellipse at center, #081020 0 42%, #113bc4 45% 58%, #18e379 62% 70%, transparent 73%);
    }
    #ui-slippy {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      width: 96px; height: 96px; image-rendering: pixelated; z-index: 2;
      filter: drop-shadow(0 3px 0 #071128);
    }
    #ui-no-codex {
      position: absolute; left: calc(50% + 62px); top: 4px;
      min-width: 190px; min-height: 42px; padding: 7px 10px;
      display: flex; align-items: center; justify-content: center;
      color: inherit; background: #000; border: 3px solid #4ec4ff; border-radius: 9px;
    }
    #ui-no-codex::after {
      content: ''; position: absolute; left: -18px; bottom: -16px;
      width: 22px; height: 20px; background: #000;
      border-left: 3px solid #4ec4ff; transform: skewX(-35deg);
    }
    @keyframes ui-portal-rise {
      from { opacity: 0; transform: translateY(92px) scale(.72); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #ui-agent-picker {
      position: fixed; inset: 0; z-index: 95; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      box-sizing: border-box; background: rgba(0, 0, 0, .82);
    }
    #ui-agent-picker[hidden] { display: none !important; }
    .ui-agent-picker-card {
      position: relative; width: min(92vw, 560px); padding: 30px 24px 24px;
      box-sizing: border-box; background: #05070f;
      border: 4px double #4ec4ff; border-radius: 12px;
      display: flex; flex-direction: column; align-items: stretch; gap: 12px;
      box-shadow: 0 0 0 3px #121938, 0 16px 60px #000;
    }
    #ui-agent-picker-title { display: flex; justify-content: center; margin-bottom: 8px; }
    .ui-agent-option {
      min-height: 54px; padding: 10px 12px; color: inherit;
      background: #11182c; border: 3px solid #4ec4ff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .ui-agent-option:disabled { opacity: .42; cursor: not-allowed; filter: none; }
    #ui-agent-picker-note { display: flex; justify-content: center; min-height: 18px; margin-top: 2px; }
    #ui-agent-picker-close {
      position: absolute; top: 7px; right: 9px; width: 34px; height: 34px;
      color: #ffe019; background: transparent; border: 2px solid #394258;
      border-radius: 5px; font: 900 20px/1 monospace;
    }
    .chrome-agent-frame {
      position: fixed; left: -4px; top: -4px; width: 1px; height: 1px;
      border: 0; opacity: .001; pointer-events: none; z-index: -1;
    }

    #ui-congrats { justify-content: center; gap: 8px; }
    #ui-congrats > div {
      position: relative; z-index: 1; padding: 2px 8px; box-sizing: border-box;
      background: rgba(0, 0, 0, .88); box-shadow: 0 0 0 3px rgba(0, 0, 0, .88);
    }
    #ui-win-rows {
      width: min(94vw, 720px); display: flex; flex-direction: column; gap: 10px; margin: 16px 0;
      padding: 10px 12px !important; border: 2px solid rgba(78, 196, 255, .55);
    }
    .ui-win-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; }
    #ui-win-final { margin-top: 12px; }

    #ui-rematch { justify-content: center; gap: 16px; }
    .ui-big {
      width: min(92vw, 560px); min-height: 56px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; border: 3px solid #e8ea9a; padding: 12px;
    }
    #ui-play-again { background: #b7b95c; }
    #ui-exit-lb { background: #26304f; }

    /* Unfolded phone/tablet folds are a distinct posture: use the inner display
       edge-to-edge instead of inheriting the narrow desktop column caps. */
    @media (min-width: 680px) and (max-width: 1100px) and (min-aspect-ratio: 18/25) and (max-aspect-ratio: 7/5) {
      .ui-lb, .ui-modes, .ui-oauth-row, #ui-keys, #ui-name-val,
      #ui-name-start, .ui-connect-box, #ui-win-rows, .ui-big {
        width: calc(100vw - 32px);
        max-width: none;
      }
      .ui-logo, .ui-logo-menu { max-width: calc(100vw - 32px); }
    }
    @media (min-width: 680px) and (max-width: 1100px) and (min-aspect-ratio: 18/25) and (max-aspect-ratio: 7/5) and (max-height: 800px),
           (min-width: 1101px) and (max-height: 800px) {
      #ui-title { padding-top: 6px; padding-bottom: 52px; overflow: hidden; }
      #ui-presents { margin-bottom: 2px; }
      #ui-title .ui-logo { width: min(55vw, 480px); max-height: 34vh; object-fit: contain; margin: 0 0 4px; }
      #ui-title .ui-lb { padding: 4px 7px 3px; }
      #ui-title .ui-lb-head { padding: 3px 7px; }
      #ui-title .ui-lb-row { min-height: 22px; padding: 2px 7px; }
      #ui-title #ui-press-start { padding: 6px 14px; margin-top: 3px; }
      #ui-title .ui-foot { min-height: 30px; padding-top: 0; }
      #ui-title .ui-foot img { height: 28px; }
      #ui-menu { gap: 6px; padding-top: 8px; padding-bottom: 64px; overflow-y: hidden; }
      #ui-menu .ui-logo-menu {
        width: min(55vw, 480px); max-height: 36vh; object-fit: contain;
        margin-bottom: 8px;
      }
      #ui-menu .ui-modes { gap: 4px; }
      #ui-menu-agent, #ui-menu-press { margin-top: 8px; }
      #ui-menu-press { padding: 8px 20px; }
    }

    @media (max-width: 520px) {
      .ui-logo { width: min(94vw, 520px); }
      .ui-lb { width: 94vw; padding: 0; border: 2px solid #4ec4ff; border-radius: 0; }
      .ui-lb-head, .ui-lb-row { grid-template-columns: 24px minmax(0, .95fr) minmax(0, 1.15fr); }
      .ui-lb-name { padding-right: 5px; }
      .ui-lb-intel, .ui-lb-head > :last-child { padding-left: 5px; }
      #ui-title { padding-left: 10px; padding-right: 10px; }
      #ui-title .ui-logo { margin-bottom: 8px; }
      .ui-key { min-height: 40px; }
      #ui-copy { position: relative; top: auto; right: auto; width: 184px; height: 94px; align-self: flex-end; margin: -26px 2px -2px auto; }
      .ui-copy-callout { min-width: 176px; min-height: 34px; padding: 5px 7px; }
      .ui-copy-icon { width: 56px; height: 56px; right: 58px; top: 37px; }
      #ui-connect { justify-content: flex-start; padding-top: 16px; }
      .ui-connect-box { margin-top: 42px; padding-top: 44px; }
      #ui-connect-h { position: relative; top: auto; left: auto; transform: none; margin: -4px auto 12px; }
      .ui-cradle-loader { width: min(58vw, 218px); margin-top: -8px; }
      #ui-agent-teaser { display: none !important; }
    }
    @media (max-width: 520px) and (orientation: portrait) {
      #trackball-container { bottom: max(62px, calc(env(safe-area-inset-bottom) + 54px)); }
      #settings {
        left: max(6px, env(safe-area-inset-left));
        right: max(6px, env(safe-area-inset-right));
        gap: 6px; padding: 4px 6px; font-size: 9px;
      }
      #settings input[type="range"] { width: 54px; }
    }
    @media (pointer: coarse) { #ui-agent-teaser { display: none !important; } }
    @media (max-height: 520px) and (orientation: landscape) {
      #ui-title, #ui-name, #ui-connect, #ui-congrats, #ui-menu, #ui-rematch {
        padding: 6px 10px 48px; gap: 4px;
      }
      .ui-logo { width: min(36vw, 300px); margin: 0 0 4px; }
      #ui-menu .ui-logo-menu { width: min(30vw, 260px); }
      #ui-menu .ui-modes { gap: 2px; }
      #ui-menu-agent, #ui-menu-press { margin-top: 2px; }
      .ui-lb { width: min(52vw, 480px); padding: 4px 6px; }
      #ui-title { flex-flow: row wrap; justify-content: center; align-content: center; }
      #ui-title .ui-spread, #ui-title #ui-presents, #ui-title #ui-press-start, #ui-title .ui-foot { width: 100%; }
      #ui-keys { gap: 3px; width: min(70vw, 640px); }
      .ui-key { min-height: 28px; }
      #ui-name { gap: 2px; overflow-y: hidden; }
      #ui-oauth-hint { margin-top: 0; }
      .ui-oauth-row { margin: 2px 0; gap: 8px; }
      .ui-oauth { width: 120px; height: 32px; }
      .ui-oauth svg { width: 16px; height: 16px; }
      #ui-name-val { min-height: 32px; margin: 2px 0; }
      #ui-keys { grid-auto-rows: 28px; }
      #ui-name-start { min-height: 32px; margin-top: 2px; }
      .ui-foot { min-height: 28px; }
      .ui-foot img { height: 24px; }
      #ui-agent-teaser { display: none !important; }
    }

    #trackball:active {
      cursor: grabbing;
    }
    #trackball-label {
      margin-top: 5px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #9aa0ff;
      background: rgba(10, 12, 24, 0.85);
      border: 1px solid #3a4078;
      border-radius: 4px;
      padding: 3px 8px;
      text-transform: uppercase;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

  </style>
</head>
<body>
  <canvas id="game" width="288" height="240"></canvas>
  <canvas id="ui-fx" hidden></canvas>
  <section id="agent-console" aria-label="WebMCP agent console" hidden>
    <header class="agent-console-head">
      <div id="agent-console-title"></div>
      <div id="agent-console-link"></div>
    </header>
    <div class="agent-rig">
      <div class="agent-conduit"><span class="agent-energy-dot"></span></div>
      <div class="agent-ball-bay">
        <div class="agent-ball-ring"></div>
        <div class="agent-ball-caption" id="agent-ball-caption"></div>
      </div>
      <div class="agent-flux" aria-hidden="true">
        <svg viewBox="0 0 280 390">
          <path class="agent-flux-arm" d="M140 194 L140 55 M140 194 L42 300 M140 194 L238 300" />
          <path class="agent-flux-arm-core" d="M140 194 L140 55 M140 194 L42 300 M140 194 L238 300" />
          <circle class="agent-flux-node" cx="140" cy="42" r="25" />
          <circle class="agent-flux-node" cx="31" cy="312" r="25" />
          <circle class="agent-flux-node" cx="249" cy="312" r="25" />
          <circle id="agent-flux-core" cx="140" cy="194" r="38" />
        </svg>
        <div class="agent-flux-label" id="agent-flux-label"></div>
      </div>
      <div class="agent-terminal">
        <div class="agent-terminal-bar">
          <span class="agent-led on"></span><span class="agent-led"></span><span class="agent-led"></span>
          <span class="agent-terminal-title">XTERM // LIVE MCP BUS</span>
        </div>
        <div id="agent-terminal-log" role="log" aria-live="polite"></div>
      </div>
    </div>
    <footer class="agent-console-foot">
      <div id="agent-console-status"></div>
      <div id="agent-console-tools"></div>
    </footer>
  </section>
  <div id="ui-root" hidden>
    <section id="ui-title" hidden>
      <div class="ui-spread" id="ui-spread"></div>
      <div id="ui-presents"></div>
      <img class="ui-logo" src="/assets/screens/parts/logo.png" alt="Marble Madness">
      <div class="ui-lb">
        <div class="ui-lb-head">
          <div id="ui-col-player"></div>
          <div id="ui-col-intel"></div>
        </div>
        <div id="ui-lb-rows"></div>
      </div>
      <button type="button" class="ui-tap" id="ui-press-start"></button>
      <footer class="ui-foot"><img src="/assets/screens/parts/icons_browsers.png" alt=""></footer>
    </section>
    <section id="ui-menu" hidden>
      <img class="ui-logo ui-logo-menu" src="/assets/screens/parts/logo.png" alt="Marble Madness">
      <div class="ui-modes">
        <button type="button" class="ui-tap ui-mode" id="ui-mode-0"></button>
        <button type="button" class="ui-mode ui-tap" id="ui-mode-1"></button>
      </div>
      <div id="ui-menu-agent"></div>
      <button type="button" class="ui-tap" id="ui-menu-press"></button>
    </section>
    <section id="ui-name" hidden>
      <div id="ui-name-p1"></div>
      <div id="ui-name-h"></div>
      <div id="ui-oauth-hint"></div>
      <div class="ui-oauth-row">
        <button type="button" class="ui-tap ui-oauth" id="ui-github" aria-label="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.6 7.6 0 0 1 8 4.77c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
          <span id="ui-github-label"></span>
        </button>
        <button type="button" class="ui-tap ui-oauth" id="ui-twitter" aria-label="Twitter">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.725-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          <span id="ui-twitter-label"></span>
        </button>
      </div>
      <div id="ui-name-val"></div>
      <div id="ui-keys"></div>
      <button type="button" class="ui-tap" id="ui-name-start"></button>
    </section>
    <section id="ui-connect" hidden>
      <div class="ui-connect-box">
        <div class="ui-speech" id="ui-speech"></div>
        <button type="button" class="ui-tap" id="ui-copy" aria-label="Copy Codex challenge to clipboard"></button>
        <div id="ui-connect-h"></div>
        <div id="ui-connect-body"></div>
        <div class="ui-marble-row">
          <span>···</span>
          <canvas id="ui-connect-marble" width="56" height="56"></canvas>
          <span>···</span>
        </div>
      </div>
      <div id="ui-connect-wait"></div>
      <div class="ui-cradle-loader" role="img" aria-label="Animated Newton's cradle while waiting for the WebMCP agent">
        <img src="/assets/screens/parts/newtons-cradle-loader.png" alt="">
        <span class="ui-cradle-pendulum ui-cradle-left" aria-hidden="true"><span class="ui-cradle-ball"></span></span>
        <span class="ui-cradle-pendulum ui-cradle-right" aria-hidden="true"><span class="ui-cradle-ball"></span></span>
      </div>
      <button type="button" class="ui-tap" id="ui-chrome-ai" hidden></button>
      <div id="ui-agent-teaser" hidden>
        <button type="button" class="ui-tap" id="ui-no-codex" aria-label="Choose an agent without Codex"></button>
        <canvas id="ui-slippy" width="48" height="48" aria-label="Slippy emerging from a portal"></canvas>
        <div class="ui-portal" aria-hidden="true"></div>
      </div>
      <div id="ui-agent-picker" role="dialog" aria-modal="true" aria-label="Choose local agent" hidden>
        <div class="ui-agent-picker-card">
          <button type="button" class="ui-tap" id="ui-agent-picker-close" aria-label="Close agent chooser">×</button>
          <div id="ui-agent-picker-title"></div>
          <button type="button" class="ui-tap ui-agent-option" id="ui-agent-option-chrome"></button>
          <button type="button" class="ui-tap ui-agent-option" id="ui-agent-option-llama" aria-label="llama.cpp requires a local bridge" disabled></button>
          <button type="button" class="ui-tap ui-agent-option" id="ui-agent-option-mtplx" aria-label="MTPLX requires a local bridge" disabled></button>
          <div id="ui-agent-picker-note"></div>
        </div>
      </div>
    </section>
    <section id="ui-congrats" hidden>
      <div id="ui-win-h"></div>
      <div id="ui-win-who"></div>
      <div id="ui-win-sub"></div>
      <div id="ui-win-sub2"></div>
      <div id="ui-win-rows"></div>
      <div id="ui-win-final"></div>
    </section>
    <section id="ui-rematch" hidden>
      <div id="ui-rematch-h"></div>
      <div id="ui-rematch-score"></div>
      <button type="button" class="ui-tap ui-big" id="ui-play-again"></button>
      <button type="button" class="ui-tap ui-big" id="ui-exit-lb"></button>
    </section>
  </div>
  <aside id="android-app-prompt" role="complementary" aria-label="Get the Marble Madness Android app" hidden>
    <div class="android-app-card">
      <div class="android-app-copy">
        <div id="android-app-title" aria-label="Get the Android app"></div>
        <div class="android-app-benefits" aria-label="Rich haptics, minimal binary size, and no ads">
          <span class="android-app-benefit" id="android-app-haptics"></span>
          <span class="android-app-benefit" id="android-app-size"></span>
          <span class="android-app-benefit" id="android-app-ads"></span>
        </div>
        <div id="android-app-pwa-note"></div>
      </div>
      <div class="android-app-actions">
        <a class="ui-tap" id="android-app-open" href="https://play.google.com/store/apps/details?id=build.secure.marbles" target="_blank" rel="noopener" aria-label="Install Marble Madness from Google Play"></a>
        <button class="ui-tap" id="android-app-dismiss" type="button" aria-label="Dismiss Android app prompt"></button>
      </div>
    </div>
  </aside>
  <aside id="desktop-controls-help" role="dialog" aria-modal="true" aria-label="Desktop trackball controls" hidden>
    <div class="desktop-controls-card">
      <div id="desktop-controls-title"></div>
      <div id="desktop-controls-lead"></div>
      <div class="desktop-controls-steps">
        <div id="desktop-controls-step1"></div>
        <div id="desktop-controls-step2"></div>
        <div id="desktop-controls-step3"></div>
      </div>
      <div id="desktop-controls-alt"></div>
      <button class="ui-tap" id="desktop-controls-dismiss" type="button"></button>
    </div>
  </aside>
  <div id="trackball-container">
    <canvas id="trackball" width="240" height="240"></canvas>
    <div id="trackball-label">ARCADE TRACKBALL</div>
  </div>
  <div id="settings">
    <label>Music <input id="vol-music" type="range" min="0" max="1" step="0.05" /></label>
    <label>SFX <input id="vol-sfx" type="range" min="0" max="1" step="0.05" /></label>
    <label><input id="opt-haptics" type="checkbox" checked /> Haptics</label>
    <a id="privacy-link" href="/privacy.html" target="_blank" rel="noopener">Privacy</a>
    <a id="support-link" href="/support.html" target="_blank" rel="noopener">Support</a>
  </div>
  <script type="module" src="/bundle.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8751bf21a9d94a478c8342235f896a9b"}'></script><!-- End Cloudflare Web Analytics -->
</body>
