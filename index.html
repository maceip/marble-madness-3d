<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Marble Madness" />
  <meta name="application-name" content="Marble Madness" />
  <meta name="msapplication-TileColor" content="#000000" />
  <title>Marble Madness</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Courier New", monospace; color: #cfd2ff; }
    canvas#game {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      cursor: crosshair;
    }
    #settings {
      position: fixed;
      left: max(14px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      font-size: 11px;
      color: #9aa0ff;
      background: rgba(10, 12, 24, 0.75);
      border: 1px solid rgba(74, 80, 168, 0.4);
      border-radius: 4px;
      padding: 4px 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      opacity: .4;
      z-index: 50;
      transition: opacity .15s ease;
    }
    #settings:hover { opacity: 1; }
    #settings input[type="range"] { width: 80px; }
    #settings input[type="checkbox"] { width: auto; }

    /* 3D Bowling Ball Trackball Dock (Bottom Right on Mobile & Desktop) */
    #trackball-container {
      position: fixed;
      bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 25;
    }
    #trackball {
      width: 160px;
      height: 160px;
      cursor: grab;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85), inset 0 0 16px rgba(0,0,0,0.9);
      touch-action: none;
    }
    #ui-root {
      position: fixed; inset: 0; z-index: 30; pointer-events: auto;
      display: flex; flex-direction: column;
    }
    #ui-root[hidden] { display: none !important; }
    /* --- agent page (the AI's browser): MARBLE MADNESS // AGENT MODE, MCP terminal, optical trackball dock ---------
       Two compositions from the conformance refs: agent_webpage.png (narrow / portrait embedded browser: one column)
       and desktop_agent_browser.png (>= 1100 px: side panels with live telemetry either side of the terminal).
       Chamfered frames are two nested clip-paths (frame colour outside, panel fill inside). */
    #agent-console {
      --ui-blue: #46a0ff; --ui-frame: #32a0f4; --agent-line: #22467a; --agent-fill: #050c19; --agent-dim: #6f9bd6; --agent-val: #39e9ff;
      position: fixed; inset: 0; z-index: 200; overflow: auto;
      box-sizing: border-box; padding: clamp(12px, 2.5vh, 28px) clamp(14px, 3vw, 40px) 12px;
      background:
        linear-gradient(rgba(25, 103, 196, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(25, 103, 196, .07) 1px, transparent 1px), #020407;
      background-size: 24px 24px, 24px 24px, auto;
      display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "head" "main" "dock"; row-gap: clamp(10px, 2vh, 22px);
      color: #8fd8ff;
    }
    #agent-console[hidden] { display: none !important; }
    .agent-console-head { grid-area: head; display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(96vw, 900px); justify-self: center; }
    #agent-console-title { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #agent-console-link { display: none; }
    .agent-head-rule { position: relative; width: 100%; height: 3px; background: var(--ui-frame); border-radius: 2px; }
    .agent-head-rule::after {
      content: ''; position: absolute; left: 50%; top: 3px; transform: translateX(-50%);
      border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 9px solid var(--ui-frame);
    }
    .agent-side { display: none; }
    .agent-rig { grid-area: main; display: flex; flex-direction: column; align-items: center; min-height: 0; width: min(96vw, 900px); justify-self: center; }
    .agent-conduit, .agent-flux, .agent-ball-ring, .agent-console-foot { display: none !important; }
    .agent-chamfer, .agent-chamfer-in { clip-path: polygon(var(--ch) 0, calc(100% - var(--ch)) 0, 100% var(--ch), 100% calc(100% - var(--ch)), calc(100% - var(--ch)) 100%, var(--ch) 100%, 0 calc(100% - var(--ch)), 0 var(--ch)); }
    .agent-terminal { --ch: 16px; width: 100%; height: 100%; min-height: 220px; padding: 3px; box-sizing: border-box; background: #2a5a94; }   /* narrow: fills the row like the portrait ref */
    .agent-terminal-in { --ch: 14px; width: 100%; height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; overflow: hidden; background: #000; }
    .agent-terminal-bar {
      min-height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 8px;
      background: #04101e; border-bottom: 2px solid var(--agent-line);
    }
    .agent-terminal-title { display: flex; margin-right: auto; }
    .agent-led { width: 8px; height: 8px; border-radius: 50%; background: var(--ui-frame); }
    #agent-terminal-log {
      overflow-x: hidden; overflow-y: auto; padding: 16px 16px; display: flex; flex-direction: column; justify-content: flex-start;
      gap: 6px; scrollbar-color: var(--ui-frame) #020407;
    }
    .agent-log-line { min-height: 16px; flex: 0 0 auto; white-space: nowrap; }
    .agent-log-line canvas { display: block; max-width: 100%; }
    .agent-ball-bay { grid-area: dock; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; justify-self: center; }
    .agent-ball-caption { display: flex; }
    .agent-ball-rule { position: relative; width: min(60vw, 420px); height: 2px; background: var(--ui-frame); }
    .agent-ball-rule::after {
      content: ''; position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
      border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 8px solid var(--ui-frame);
    }
    .agent-ball-dock { position: relative; width: 100%; height: calc(var(--tb) * 1.7 + 12px); }   /* the fixed trackball + housing live here */
    /* the trackball housing + four energy tubes (agent_webpage.png), laid out by agent_console.ts from the trackball's rect */
    .agent-dock { position: absolute; left: 50%; top: 0; width: 100vw; height: 100%; transform: translateX(-50%); overflow: visible; pointer-events: none; }
    .agent-tube-shell { fill: none; stroke: #0a1424; stroke-width: 30; stroke-linecap: round; }
    .agent-tube-bore { fill: none; stroke: #182c4e; stroke-width: 22; stroke-linecap: round; }
    .agent-tube-core {
      fill: none; stroke: #2f7fff; stroke-width: 8; stroke-linecap: round; opacity: .95;
      stroke-dasharray: 18 30; animation: agent-flow 1.1s linear infinite; filter: url(#agent-glow);
    }
    .agent-tube-spark { fill: none; stroke: #d8f3ff; stroke-width: 2; stroke-dasharray: 4 44; animation: agent-flow .55s linear infinite; }
    @keyframes agent-flow { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
    .agent-coupling { fill: #0f1d34; stroke: #2c4f85; stroke-width: 3; }
    .agent-plinth { fill: #0b1526; stroke: #22406e; stroke-width: 3; shape-rendering: crispEdges; }
    .agent-base { fill: #101d33; stroke: #2c4f85; stroke-width: 3; shape-rendering: crispEdges; }
    .agent-front { fill: #08111f; stroke: #22406e; stroke-width: 2; shape-rendering: crispEdges; }
    .agent-bezel { fill: #0d1a30; stroke: #33578f; stroke-width: 8; }
    .agent-housing-led { fill: #38d5ff; filter: url(#agent-glow); }
    #agent-console.pulse-to-ball .agent-tube-core, #agent-console.pulse-to-terminal .agent-tube-core { animation-duration: .28s; stroke: #7cc4ff; }
    #agent-console.pulse-to-ball .agent-tube-spark, #agent-console.pulse-to-terminal .agent-tube-spark { animation-duration: .16s; }
    #agent-console.pulse-to-terminal .agent-tube-core, #agent-console.pulse-to-terminal .agent-tube-spark { animation-direction: reverse; }
    #agent-console.pulse-spin .agent-bezel { stroke: #fff; }
    #agent-console.pulse-spin .agent-housing-led { fill: #fff; }
    /* side panels (desktop composition) */
    .agent-panel { --ch: 12px; padding: 2px; background: var(--agent-line); }
    .agent-panel-in { --ch: 11px; background: var(--agent-fill); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .agent-panel-title { display: flex; padding-bottom: 8px; border-bottom: 2px solid var(--agent-line); }
    .agent-rows { display: flex; flex-direction: column; gap: 6px; }
    .agent-row { display: flex; align-items: center; gap: 8px; min-height: 14px; }
    .agent-row .agent-val { margin-left: auto; display: flex; }
    .agent-dot { width: 6px; height: 6px; background: #3a8bff; flex-shrink: 0; }
    .agent-dot.on { background: var(--agent-val); box-shadow: 0 0 6px var(--agent-val); }
    .agent-bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; padding: 3px 6px; border: 1px dashed var(--agent-line); }
    .agent-bar { width: 6px; min-height: 2px; background: #3a8bff; }
    .agent-caption { display: none; position: absolute; flex-direction: column; gap: 3px; pointer-events: none; }
    .agent-caption.tl { top: 18px; left: 26px; } .agent-caption.tr { top: 18px; right: 26px; align-items: flex-end; }
    .agent-caption.ml { top: 61%; left: 26px; } .agent-caption.mr { top: 63%; right: 26px; align-items: flex-end; }
    .agent-caption.bl { bottom: 22px; left: 26px; } .agent-caption.br { bottom: 22px; right: 26px; align-items: flex-end; }
    .agent-caption.tl::before, .agent-caption.tr::before {
      content: ''; position: absolute; top: -10px; width: 22px; height: 22px; border: 3px solid var(--ui-frame);
    }
    .agent-caption.tl::before { left: -12px; border-right: 0; border-bottom: 0; }
    .agent-caption.tr::before { right: -12px; border-left: 0; border-bottom: 0; }
    body.agent-console-active { --tb: min(30vw, 300px, 28vh); }   /* trackball size: shared by the dock band and the fixed ball */
    body.agent-console-active #game, body.agent-console-active #ui-root,
    body.agent-console-active #ui-fx, body.agent-console-active #settings,
    body.agent-console-active #android-app-prompt, body.agent-console-active #desktop-controls-help { display: none !important; }
    body.agent-console-active #trackball-container {
      display: flex !important; z-index: 220; left: 50%; right: auto; top: auto;
      bottom: calc(var(--tb) * .5 + 14px); transform: translateX(-50%);
    }
    body.agent-console-active #trackball { width: var(--tb); height: var(--tb); cursor: default; }
    body.agent-console-active #trackball-label { display: none; }
    @media (min-width: 1100px) {
      #agent-console {
        grid-template-columns: clamp(180px, 14vw, 230px) minmax(0, 1fr) clamp(180px, 14vw, 230px);
        grid-template-areas: "head head head" "left main right" "dock dock dock";
        column-gap: clamp(16px, 2.5vw, 48px); padding-left: clamp(24px, 5vw, 90px); padding-right: clamp(24px, 5vw, 90px);
      }
      .agent-console-head { width: 100%; max-width: none; }
      .agent-rig { width: 100%; max-width: none; }
      .agent-side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
      .agent-terminal { height: min(40vh, 480px); }
      .agent-side-left { grid-area: left; } .agent-side-right { grid-area: right; }
      .agent-caption { display: flex; }
    }
    @media (max-width: 620px) {
      #agent-console { padding: 10px 12px 12px; row-gap: 10px; }
      .agent-terminal { height: min(38vh, 420px); min-height: 200px; }
      .agent-terminal-bar { min-height: 30px; padding: 0 8px; }
      #agent-terminal-log { padding: 10px 8px; gap: 3px; }
      body.agent-console-active { --tb: min(42vw, 200px); }
    }
    #ui-fx {
      /* Celebration marbles remain visible around the tally, but never paint over
         the score text or controls. #ui-root owns the readable foreground. */
      position: fixed; inset: 0; z-index: 29; pointer-events: none;
      width: 100vw; height: 100dvh;
    }
    #ui-fx[hidden] { display: none !important; }
    /* sign-in verdict (birds + speech bubble) plays over the name screen; on success it also catches the tap that skips ahead */
    #ui-fx.ui-fx-front { z-index: 40; }
    #ui-fx.ui-fx-catch { pointer-events: auto; }
    .ui-screen, #ui-title, #ui-menu, #ui-name, #ui-connect, #ui-congrats, #ui-rematch {
      pointer-events: auto;
      position: absolute; inset: 0;
      z-index: 2;
      display: flex; flex-direction: column;
      align-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 72px max(12px, env(safe-area-inset-left));
      box-sizing: border-box;
      width: 100%;
      overflow-x: hidden; overflow-y: auto;
    }
    #ui-title[hidden], #ui-menu[hidden], #ui-name[hidden], #ui-connect[hidden],
    #ui-congrats[hidden], #ui-rematch[hidden] { display: none !important; }

    .ui-tap {
      cursor: pointer; appearance: none; -webkit-appearance: none;
      transition: transform 90ms ease, filter 90ms ease, box-shadow 90ms ease;
      transform-origin: center;
      touch-action: manipulation;
    }
    .ui-tap:hover { filter: brightness(1.12); }
    .ui-tap:active, .ui-tap.pressed {
      transform: translateY(5px) scale(0.96);
      filter: brightness(0.82);
    }
    .ui-tap:focus-visible { outline: 2px solid #ffe019; outline-offset: 2px; }

    #android-app-prompt {
      position: fixed; z-index: 90;
      left: max(8px, env(safe-area-inset-left));
      right: max(8px, env(safe-area-inset-right));
      bottom: max(58px, calc(env(safe-area-inset-bottom) + 54px));
      display: flex; justify-content: center; pointer-events: none;
    }
    #android-app-prompt[hidden] { display: none !important; }
    #desktop-controls-help {
      position: fixed; inset: 0; z-index: 180;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; background: rgba(0, 0, 0, .88);
    }
    #desktop-controls-help[hidden] { display: none !important; }
    .desktop-controls-card {
      width: min(92vw, 610px); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 30px 26px 24px; background: #000;
      border: 6px double #4ec4ff; border-radius: 12px;
      box-shadow: 0 0 0 4px #000, 0 20px 60px rgba(0, 0, 0, .95);
    }
    .desktop-controls-steps { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    #desktop-controls-alt { margin-top: 4px; }
    #desktop-controls-dismiss {
      min-width: 290px; min-height: 54px; padding: 12px 18px;
      background: #ffd23f; border: 3px solid #ffe89a; border-radius: 8px;
    }
    .android-app-card {
      pointer-events: auto; width: min(100%, 540px); min-height: 78px; box-sizing: border-box;
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
      padding: 8px; background: rgba(2, 4, 10, .96);
      border: 3px double #4ec4ff; border-radius: 8px;
      box-shadow: 0 0 0 2px #000, 0 8px 24px rgba(0, 0, 0, .9);
    }
    .android-app-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
    .android-app-benefits { display: flex; flex-wrap: wrap; gap: 3px; }
    .android-app-benefit {
      display: flex; align-items: center; min-height: 17px; padding: 2px 4px;
      border: 1px solid #293a6b; border-radius: 3px; background: #090d1a;
    }
    #android-app-pwa-note { opacity: .82; }
    .android-app-actions { display: flex; align-items: center; gap: 5px; }
    .android-app-actions > * {
      min-width: 0; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      padding: 7px 6px; border-radius: 5px; text-decoration: none;
    }
    #android-app-open { min-width: 92px; min-height: 42px; background: #ffd23f; border: 2px solid #ffe89a; }
    #android-app-dismiss { width: 30px; height: 30px; padding: 3px; background: #111524; border: 2px solid #4a50a8; }
    @media (max-width: 390px) {
      .android-app-card { gap: 5px; padding: 5px 6px; }
      #android-app-open { min-width: 78px; }
      #android-app-dismiss { width: 28px; height: 28px; }
    }

    /* ------------------------------------------------------------------------------------------------
       Menu screens. Layout follows the conformance wireframes (docs: ~/Downloads/MANDATORY_CONFORMANCE):
       bitmap-font labels are canvases painted by src/ui/menus.ts; --sc is the font scale it chose
       (1 phone / 2 mid / 3 desktop), so spacing here is expressed in glyph heights (8px * --sc).
       ------------------------------------------------------------------------------------------------ */
    #ui-root {
      --sc: 2;
      --ui-blue: #46a0ff; --ui-frame: #32a0f4; --ui-gold: #ffc008;
      --ui-yellow: #ffee33; --ui-yellow-fill: #fbe010; --ui-cyan: #00ffff;
      --glyph: calc(8px * var(--sc));                 /* body glyph height */
      --hglyph: calc(8px * (var(--sc) + 1));          /* heading glyph height */
    }
    .ui-word { display: flex; }
    .ui-stars { background-color: #000; }
    @media (max-width: 700px) {
      /* phone name/connect wireframes sit on a starfield */
      .ui-stars {
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #cfe6ff 99%, transparent),
          radial-gradient(1px 1px at 78% 9%, #9fd0ff 99%, transparent),
          radial-gradient(2px 2px at 88% 30%, #ffffff 99%, transparent),
          radial-gradient(1px 1px at 33% 41%, #cfe6ff 99%, transparent),
          radial-gradient(1.5px 1.5px at 62% 57%, #ffffff 99%, transparent),
          radial-gradient(1px 1px at 8% 66%, #9fd0ff 99%, transparent),
          radial-gradient(2px 2px at 92% 72%, #cfe6ff 99%, transparent),
          radial-gradient(1px 1px at 47% 83%, #ffffff 99%, transparent),
          radial-gradient(1.5px 1.5px at 20% 93%, #9fd0ff 99%, transparent),
          radial-gradient(1px 1px at 70% 96%, #cfe6ff 99%, transparent);
        background-size: 390px 420px;
      }
    }

    /* --- shared button states (wireframe: hover = outline, pressed = fill + dark label) ------------------- */
    .ui-cta {
      background: transparent; border: 3px solid transparent; border-radius: 10px;
      padding: calc(var(--glyph) * .55) calc(var(--glyph) * 1.1);
      display: flex; align-items: center; justify-content: center;
    }
    .ui-cta:hover { border-color: var(--ui-yellow); filter: none; }
    .ui-cta:active, .ui-cta.pressed { background: var(--ui-yellow-fill); border-color: var(--ui-yellow-fill); transform: none; filter: none; }
    .ui-cta:active canvas, .ui-cta.pressed canvas { filter: brightness(0); }

    /* --- splash / high rollers ------------------------------------------------------------------------- */
    .ui-spread { display: none !important; }
    #ui-title { justify-content: flex-start; gap: 0; padding-bottom: 48px; }
    #ui-presents { display: none; margin: 4px 0 6px; }
    #ui-title .ui-logo {
      width: min(56vw, 500px); max-width: 100%; height: auto;
      image-rendering: pixelated; image-rendering: crisp-edges;
      margin: clamp(4px, 1.5vh, 16px) 0 clamp(6px, 1.5vh, 14px);
    }
    #ui-lb-title { display: flex; margin: 0 0 calc(var(--glyph) * .9); }
    .ui-lb { --lbgap: 1.2; width: min(92vw, 900px); display: flex; flex-direction: column; box-sizing: border-box; }
    @media (min-width: 1200px) { .ui-lb { --lbgap: 2; } }
    .ui-lb-head, .ui-lb-row {
      display: grid;
      grid-template-columns: calc(var(--glyph) * 2) minmax(0, 1fr) calc(var(--glyph) * 7) calc(var(--glyph) * 12);
      column-gap: calc(var(--glyph) * var(--lbgap)); align-items: center;
      height: calc(var(--glyph) * 1.45);
    }
    .ui-lb-head { margin-bottom: calc(var(--glyph) * .3); }
    .ui-lb-rank, .ui-lb-head > :nth-child(1) { justify-self: end; }
    .ui-lb-name, .ui-lb-head > :nth-child(2) { justify-self: start; min-width: 0; overflow: hidden; }
    .ui-lb-score, .ui-lb-head > :nth-child(3) { justify-self: end; }
    .ui-lb-intel, .ui-lb-head > :nth-child(4) { justify-self: start; }
    #ui-press-start {
      display: flex; justify-content: center; align-items: center;
      background: none; border: 0; padding: 10px 18px;
      margin-top: auto; margin-bottom: clamp(6px, 5vh, 56px);
    }
    .ui-foot { display: none !important; }

    /* --- 1 player / 2 players ------------------------------------------------------------------------- */
    #ui-menu { justify-content: flex-start; gap: 0; background: #000; }
    .ui-logo-menu {
      width: min(70vw, 600px); max-width: 100%; height: auto; image-rendering: pixelated;
      margin: clamp(4px, 2vh, 20px) 0 clamp(28px, 9vh, 96px);
    }
    .ui-modes { display: flex; flex-direction: column; gap: calc(var(--glyph) * .9); align-items: flex-start; margin: 0 auto; }
    .ui-mode {
      display: flex; align-items: center; gap: calc(var(--glyph) * .9);
      background: transparent; border: 0; color: inherit; padding: 4px 8px; text-align: left;
    }
    .ui-mode:hover { filter: none; } .ui-mode:active, .ui-mode.pressed { transform: none; filter: none; }
    .ui-mode-col { display: flex; align-items: center; }
    .ui-mark { width: calc(var(--hglyph) * 1.5); height: calc(var(--hglyph) * 1.5); flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
    .ui-mode-marble { width: 100%; height: 100%; image-rendering: pixelated; }
    #ui-menu-sub { display: flex; margin-top: clamp(22px, 6vh, 70px); }
    #ui-menu-press { margin-top: clamp(22px, 6vh, 70px); margin-bottom: clamp(6px, 3vh, 32px); }

    /* --- enter your name ------------------------------------------------------------------------------ */
    #ui-name { justify-content: flex-start; gap: 0; }
    .ui-name-head { display: flex; flex-direction: column; align-items: center; gap: calc(var(--glyph) * .5); margin-top: auto; }
    #ui-name-val { display: flex; justify-content: center; align-items: center; min-height: var(--hglyph); margin: clamp(14px, 3.5vh, 40px) 0 clamp(18px, 4vh, 48px); }
    .ui-keys-wrap { position: relative; }
    #ui-keys {
      --key: clamp(46px, 13.4vw, 108px); --keyh: clamp(54px, 10vh, 100px);
      display: grid; grid-template-columns: repeat(7, var(--key)); grid-auto-rows: var(--keyh); gap: 0;
      position: relative; z-index: 1;

    .ui-key {
      position: relative; background: transparent; border: 0; border-radius: 8px; padding: 0;

    #ui-name-marble {

      transition: transform .32s cubic-bezier(.25, .9, .35, 1.08); opacity: .9;
    }
    .ui-oauth-row { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vw, 28px); width: min(90vw, 680px); margin-top: clamp(20px, 5.5vh, 64px); }
    .ui-rule { flex: 1; height: 3px; background: var(--ui-frame); border-radius: 2px; }

    .ui-oauth:active svg, .ui-oauth.pressed svg { fill: #041018; }

    /* --- connect your agent --------------------------------------------------------------------------- */
    #ui-connect { justify-content: flex-start; gap: 0; padding-top: clamp(10px, 3vh, 28px); }
    .ui-connect-logo {

    #ui-connect-body { display: flex; flex-direction: column; align-items: center; gap: calc(var(--glyph) * .6); width: 100%; }

    #ui-copy {
      position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(64px, calc(env(safe-area-inset-bottom) + 58px));

    #ui-chrome-ai { display: none !important; }

    /* the "no Codex?" moment: the marble mascot springs in and asks (desktop, after 30 s idle). The bubble is
       mirrored so its tail is on the left, over the ball (ballCentre x = 170/351); menus.ts picks .compact or
       hides the teaser when the band under the connect copy is too short for it. */
    #ui-agent-teaser {
      position: absolute; left: clamp(8px, 3vw, 48px); bottom: max(60px, calc(env(safe-area-inset-bottom) + 56px));
      width: 320px; height: 300px; pointer-events: none;
    }
    #ui-agent-teaser[hidden] { display: none !important; }
    .ui-mascot {
      --frames: 12; --fw: 351px; --fh: 338px; --period: 1s; --scale: .5;
      position: absolute; left: 50%; bottom: 0; width: var(--fw); height: var(--fh);
      background: url(/assets/sprites/mascot.png) 0 0 / auto 100% no-repeat;
      transform-origin: 50% 100%; transform: translateX(-50%) scale(var(--scale));
      animation: mascot-spin var(--period) steps(var(--frames)) infinite;
      transition: transform .35s cubic-bezier(.2, 1.4, .4, 1), opacity .25s;
      image-rendering: pixelated;
    }
    .ui-mascot.hidden { transform: translateX(-50%) scale(0); opacity: 0; }
    #ui-agent-teaser.compact .ui-mascot { --scale: .38; }
    @keyframes mascot-spin { to { background-position-x: calc(var(--fw) * -1 * var(--frames)); } }
    #ui-no-codex {
      --px: 3px;
      position: absolute; left: 124px; bottom: 176px; pointer-events: auto;
      box-sizing: border-box; white-space: nowrap;
      padding: calc(1 * var(--px)) calc(2 * var(--px)) calc(2 * var(--px));
      border-style: solid; border-width: calc(3 * var(--px)) calc(5 * var(--px)) calc(4 * var(--px)) calc(5 * var(--px));
      border-image: url(/assets/ui/bubble_body.png) 3 5 4 5 fill / calc(3 * var(--px)) calc(5 * var(--px)) calc(4 * var(--px)) calc(5 * var(--px)) stretch;
      background: transparent; color: #000; image-rendering: pixelated;
      transform-origin: 50% 100%; transform: scaleX(-1);
      transition: transform .3s cubic-bezier(.2, 1.4, .4, 1), opacity .2s;
    }
    #ui-no-codex > canvas { display: block; transform: scaleX(-1); }
    #ui-no-codex::after {
      content: ''; position: absolute; right: calc(6 * var(--px)); bottom: calc(-6 * var(--px));
      width: calc(10 * var(--px)); height: calc(8 * var(--px));

    }
    #ui-no-codex:hover { filter: none; } #ui-no-codex:active, #ui-no-codex.pressed { filter: brightness(.9); transform: scaleX(-1) scale(.97); }
    #ui-no-codex.hidden { transform: scaleX(-1) scale(0); opacity: 0; }
    #ui-agent-teaser.compact #ui-no-codex { --px: 2px; left: 136px; bottom: 132px; }

    /* --- select local model provider (modal) ----------------------------------------------------------- */
    #ui-agent-picker {
      position: fixed; inset: 0; z-index: 95; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 20px;
      box-sizing: border-box; background: rgba(0, 0, 0, .82);
    }
    #ui-agent-picker[hidden] { display: none !important; }
    .ui-agent-picker-card {
      position: relative; width: min(92vw, 620px); padding: 26px 24px 24px;
      box-sizing: border-box; background: #000;
      border: 4px double var(--ui-frame); border-radius: 12px;
      display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    }
    #ui-agent-picker-title { display: flex; justify-content: center; margin-bottom: 6px; }
    .ui-agent-selected {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border: 3px solid var(--ui-frame); border-radius: 10px;
    }

    .ui-agent-list { display: flex; flex-direction: column; border: 3px solid var(--ui-frame); border-radius: 10px; overflow: hidden; }
    .ui-agent-option {
      display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 14px;

    }
    .ui-agent-option:last-of-type { border-bottom: 0; }
    .ui-agent-option:hover { filter: none; background: rgba(70, 160, 255, .12); }
    .ui-agent-option:active, .ui-agent-option.pressed { transform: none; filter: none; background: rgba(70, 160, 255, .25); }
    .ui-agent-option.on { box-shadow: inset 0 0 0 3px var(--ui-yellow); border-radius: 8px; }
    .ui-agent-option:disabled { opacity: .5; cursor: not-allowed; }
    .ui-agent-icon { width: 34px; height: 34px; flex-shrink: 0; image-rendering: pixelated; }
    .ui-agent-tag { margin-left: auto; display: flex; flex-shrink: 0; opacity: .85; }
    .ui-agent-icon-chrome { background: url(/assets/screens/parts/icons_browsers.png) 0 50% / auto 100% no-repeat; }
    .ui-agent-icon svg { width: 100%; height: 100%; fill: #fff; }
    #ui-agent-picker-note { display: flex; justify-content: center; min-height: 12px; }
    .ui-agent-deco { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .ui-agent-deco canvas.ui-deco-marble { width: 40px; height: 40px; image-rendering: pixelated; }
    #ui-agent-picker-close {
      position: absolute; top: -16px; right: -16px; width: 34px; height: 34px;
      color: var(--ui-yellow); background: #000; border: 3px solid var(--ui-frame);
      border-radius: 8px; font: 900 20px/1 monospace;
    }
    .chrome-agent-frame {
      position: fixed; left: -4px; top: -4px; width: 1px; height: 1px;
      border: 0; opacity: .001; pointer-events: none; z-index: -1;
    }

    /* --- tally --------------------------------------------------------------------------------------- */
    #ui-congrats { justify-content: center; gap: 8px; }
    #ui-congrats > div {
      position: relative; z-index: 1; padding: 2px 8px; box-sizing: border-box;
      background: rgba(0, 0, 0, .88); box-shadow: 0 0 0 3px rgba(0, 0, 0, .88);
    }
    #ui-win-rows {
      width: min(94vw, 720px); display: flex; flex-direction: column; gap: 10px; margin: 16px 0;
      padding: 10px 12px !important; border: 2px solid rgba(78, 196, 255, .55);
    }
    .ui-win-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; }
    #ui-win-final { margin-top: 12px; }

    /* --- challenge the AI again (modal) --------------------------------------------------------------- */
    #ui-rematch { justify-content: flex-start; gap: 0; }
    .ui-modal {
      position: relative; width: min(92vw, 900px); box-sizing: border-box; margin: auto 0;
      padding: clamp(18px, 3.5vh, 34px) clamp(16px, 3vw, 34px);
      background: #000; border: 4px double var(--ui-frame); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.6vh, 26px);
    }
    .ui-flags { display: flex; justify-content: center; align-items: flex-end; height: calc(var(--hglyph) * 4.2); }
    .ui-flags canvas { width: calc(var(--hglyph) * 6); height: calc(var(--hglyph) * 4.2); image-rendering: pixelated; }
    #ui-rematch-h { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--glyph) * .5) var(--glyph); max-width: 100%; }
    .ui-rematch-btns { display: flex; gap: clamp(14px, 3vw, 44px); }
    .ui-big {
      min-width: clamp(112px, 30vw, 290px); min-height: calc(var(--hglyph) * 2);
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px; border: 3px solid var(--ui-frame); background: transparent; padding: 6px 14px;
    }
    .ui-big:hover { filter: none; box-shadow: 0 0 0 2px rgba(70, 160, 255, .35); }
    #ui-play-again { border-color: var(--ui-yellow); }
    #ui-play-again:hover { box-shadow: 0 0 0 2px rgba(255, 238, 51, .35); }
    #ui-play-again:active, #ui-play-again.pressed { transform: none; filter: none; background: var(--ui-yellow-fill); border-color: var(--ui-yellow-fill); }
    #ui-play-again:active canvas, #ui-play-again.pressed canvas { filter: brightness(0); }
    #ui-exit-lb:active, #ui-exit-lb.pressed { transform: none; filter: none; background: var(--ui-frame); }
    #ui-exit-lb:active canvas, #ui-exit-lb.pressed canvas { filter: brightness(0); }
    .ui-modal-rule { display: flex; align-items: center; gap: 16px; width: 82%; }
    .ui-modal-rule canvas { width: calc(var(--hglyph) * 1.3); height: calc(var(--hglyph) * 1.3); image-rendering: pixelated; }
    #ui-rematch-score { display: flex; }

    /* --- size adaptations ------------------------------------------------------------------------------ */
    /* Unfolded phone/tablet folds are a distinct posture: use the inner display edge-to-edge. */
    @media (min-width: 680px) and (max-width: 1100px) and (min-aspect-ratio: 18/25) and (max-aspect-ratio: 7/5) {
      .ui-lb, .ui-modes, .ui-oauth-row, .ui-connect-box, #ui-win-rows, .ui-modal, .ui-agent-picker-card { width: calc(100vw - 32px); max-width: none; }
      .ui-logo, .ui-logo-menu { max-width: calc(100vw - 32px); }

    @media (min-width: 680px) and (max-width: 1100px) and (min-aspect-ratio: 18/25) and (max-aspect-ratio: 7/5) and (max-height: 800px),

      #ui-title { padding-top: 6px; padding-bottom: 52px; }
      #ui-title .ui-logo { width: min(50vw, 440px); max-height: 30vh; object-fit: contain; margin: 0 0 4px; }
      .ui-lb-head, .ui-lb-row { height: calc(var(--glyph) * 1.35); }

    @media (min-width: 701px) and (max-height: 820px) {

      #ui-title .ui-logo { width: min(40vw, 380px); max-height: 26vh; object-fit: contain; margin: 0 0 4px; }
      #ui-lb-title { margin-bottom: 6px; }

      #ui-lb-title { margin-bottom: clamp(16px, 3.5vh, 34px); }
      #ui-presents { margin: 10px 0 4px; }
      .ui-logo-menu { width: min(94vw, 520px); margin: 3vh 0 clamp(40px, 20vh, 190px); }
      #ui-menu-sub { margin-top: clamp(24px, 11vh, 130px); }
      #ui-menu-press { margin-top: auto; }
      .ui-oauth-row { width: 88vw; }
      .ui-connect-logo { width: min(66vw, 320px); margin: 3vh 0 7vh; }
      #ui-connect-h { margin-bottom: 6vh; }
      .ui-marble-row { margin-top: 11vh; }
      #ui-connect-wait { margin-top: 10vh; }
      .ui-copy-icon { width: 60px; height: 60px; }
    }
    @media (max-width: 520px) {
      #ui-title { padding-left: 10px; padding-right: 10px; }
      #ui-agent-teaser { display: none !important; }

    }

      #ui-title .ui-logo { width: min(30vw, 260px); margin: 0 0 4px; }
      #ui-lb-title { margin-bottom: 4px; }
      .ui-lb { width: min(70vw, 620px); }
      .ui-lb-head, .ui-lb-row { height: calc(var(--glyph) * 1.25); }

      #ui-menu .ui-logo-menu { width: min(28vw, 240px); margin-bottom: 10px; }
      #ui-menu-sub, #ui-menu-press { margin-top: 10px; }
      #ui-keys { --keyh: clamp(30px, 11vh, 44px); --key: clamp(40px, 8vw, 70px); }

      .ui-oauth-row { margin-top: 8px; }

    #trackball:active {
      cursor: grabbing;
    }
    #trackball-label {
      margin-top: 5px;
      font-size: 10px;

    }

  </style>
