<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101018" />
    <title>Marble Madness 3D — WebGL isometric marble run</title>
    <style>
      :root {
        --ink: #f2f4ff;
        --dim: #8d95b8;
        --bg: #0b0d14;
        --panel: #141826;
        --edge: #2a3149;
        --hot: #ff3b5c;
        --cool: #33e0ff;
        --warn: #ffd23f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 500 14px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #hud button,
      #hud .click {
        pointer-events: auto;
      }
      .hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 8px 10px;
        font-size: clamp(9px, 2.1vw, 13px);
        letter-spacing: 0.06em;
        text-shadow: 0 1px 0 #000, 0 0 6px #0009;
      }
      .hud-col {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .hud-col.mid {
        align-items: center;
        flex: 1 1 auto;
      }
      .hud-col.right {
        align-items: flex-end;
        text-align: right;
      }
      .label {
        color: var(--dim);
      }
      .big {
        font-size: 1.25em;
      }
      #time.low {
        color: var(--hot);
        animation: blink 0.6s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      .lives {
        display: flex;
        gap: 4px;
        margin-top: 2px;
      }
      .lives i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #cfe6ff, #3b6bd6 60%, #101a3a);
        box-shadow: 0 0 3px #0008;
      }
      .lives i.off {
        opacity: 0.18;
      }
      #minimap {
        position: absolute;
        top: 46px;
        right: 10px;
        width: clamp(64px, 15vw, 116px);
        height: auto;
        border: 1px solid var(--edge);
        background: #0b0e18cc;
        border-radius: 4px;
      }
      #joy {
        position: absolute;
        left: 50%;
        bottom: 6%;
        transform: translateX(-50%);
        width: 168px;
        height: 168px;
        display: none;
        touch-action: none;
      }
      #joy.on {
        display: block;
      }
      #joy .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed #ffffff2b;
        background: radial-gradient(circle, #ffffff10, #00000033);
      }
      #joy .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 62px;
        height: 62px;
        margin: -31px 0 0 -31px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #93a6d8, #2b3555 70%, #14192b);
        box-shadow: 0 4px 12px #000a, inset 0 0 0 2px #ffffff22;
        transform: translate3d(0, 0, 0);
      }
      #joy.tilt .ring {
        animation: tilt 0.9s ease-in-out infinite alternate;
        border-color: #33e0ff55;
      }
      @keyframes tilt {
        from {
          transform: rotate(-2.2deg);
        }
        to {
          transform: rotate(2.2deg);
        }
      }
      #joy .cap {
        position: absolute;
        left: 50%;
        bottom: -20px;
        transform: translateX(-50%);
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }
      #brake {
        position: absolute;
        right: 14px;
        bottom: 9%;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        border: 2px solid #ff3b5c66;
        background: radial-gradient(circle at 40% 35%, #ff6b83, #a2142f 70%, #4b0715);
        color: #fff;
        font: 700 12px/1 ui-monospace, monospace;
        letter-spacing: 0.08em;
        opacity: 0.9;
        touch-action: none;
      }
      #brake:active {
        transform: scale(0.94);
      }
      #keys {
        position: absolute;
        left: 12px;
        bottom: 10px;
        color: var(--dim);
        font-size: 10.5px;
        line-height: 1.5;
        opacity: 0.85;
      }
      #keys b {
        color: var(--ink);
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 120% at 50% 0%, #1b2033ee, #05060bee);
        text-align: center;
        padding: 20px;
      }
      .overlay.hidden {
        display: none;
      }
      .title {
        font-size: clamp(22px, 7vw, 54px);
        letter-spacing: 0.06em;
        margin: 0;
        color: #fff;
        text-shadow: 0 2px 0 #ff3b5c, 0 4px 0 #b3143a, 0 8px 18px #000c;
      }
      .sub {
        color: var(--cool);
        letter-spacing: 0.22em;
        font-size: clamp(9px, 2.4vw, 13px);
      }
      .courses {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 620px;
      }
      .courses button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
        letter-spacing: 0.04em;
      }
      .courses button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      .courses button[aria-current="true"] {
        border-color: var(--warn);
        color: var(--warn);
      }
      .go {
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.14em;
        color: #0b0d14;
        background: var(--warn);
        border: 0;
        border-radius: 8px;
        padding: 12px 26px;
        cursor: pointer;
        box-shadow: 0 6px 0 #8a6b00, 0 10px 20px #0008;
      }
      .go:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #8a6b00;
      }
      .fine {
        color: var(--dim);
        font-size: 11px;
        max-width: 560px;
      }
      #banner {
        position: absolute;
        left: 50%;
        top: 34%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: clamp(16px, 4.6vw, 34px);
        letter-spacing: 0.1em;
        color: #fff;
        text-shadow: 0 2px 0 #000a, 0 0 18px #000;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #banner.show {
        opacity: 1;
      }
      #banner small {
        display: block;
        font-size: 0.45em;
        letter-spacing: 0.2em;
        color: var(--cool);
        margin-top: 6px;
      }
      #stamp {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        font-size: clamp(8px, 2vw, 11px);
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      #stamp .got {
        color: var(--warn);
      }
      #stamp .miss {
        opacity: 0.4;
      }
      #fps {
        position: absolute;
        left: 10px;
        top: 46px;
        color: #5c6688;
        font-size: 10px;
        pointer-events: auto;
        cursor: pointer;
      }
      #mp-badge {
        position: absolute;
        left: 10px;
        top: 66px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(11, 14, 24, 0.75);
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 3px 8px;
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 0.05em;
      }
      #mp-badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3bf589;
        box-shadow: 0 0 6px #3bf589;
        animation: pulse 1.5s infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.85); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      #mp-feed {
        position: absolute;
        left: 10px;
        top: 96px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
        max-width: 280px;
      }
      .mp-event {
        background: rgba(16, 20, 36, 0.88);
        border-left: 3px solid var(--warn);
        padding: 4px 8px;
        font-size: 10.5px;
        border-radius: 0 4px 4px 0;
        color: var(--ink);
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        animation: fadein 0.25s ease-out;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="hud">
        <div class="hud-top">
          <div class="hud-col">
            <div><span class="label">SCORE</span> <span id="score" class="big">0</span></div>
            <div><span class="label">HIGH</span> <span id="hiscore">0</span></div>
            <div class="lives" id="lives"></div>
          </div>
          <div class="hud-col mid">
            <div id="course">COURSE 1 — PINK GARDENS</div>
            <div><span class="label">TIME</span> <span id="time" class="big">120.0</span></div>
          </div>
          <div class="hud-col right">
            <div><span class="label">SPEED</span> <span id="speed">0</span></div>
            <div><span class="label">ITEMS</span> <span id="items">0/3</span></div>
          </div>
        </div>
        <canvas id="minimap" width="120" height="170"></canvas>
        <div id="fps" title="toggle stats">&nbsp;</div>
        <div id="mp-badge"><span class="dot"></span> <span id="mp-count">1 Online</span></div>
        <div id="mp-feed"></div>
        <div id="banner"></div>
        <div id="stamp"></div>
        <div id="joy"><div class="ring"></div><div class="knob"></div><div class="cap">TILT / DRAG TO STEER</div></div>
        <button id="brake" class="click">BRAKE</button>
        <div id="keys">
          <b>drag canvas</b> steer · <b>WASD/↑↓←→</b> · <b>space</b> brake<br />
          <b>R</b> restart course · <b>esc</b> menu · <b>c</b> camera · <b>m</b> mute · <b>tap fps</b> stats
        </div>
        <div class="overlay hidden" id="menu"></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
