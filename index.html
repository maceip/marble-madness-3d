<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Marble Madness</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Courier New", monospace; color: #cfd2ff; }
    canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; cursor: crosshair; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
    #overlay.show { display: flex; }
    .panel { pointer-events: auto; background: #000; border: 4px double #9aa0ff; padding: 20px 26px; max-width: min(90vw, 720px); color: #cfd2ff; font-size: 18px; line-height: 1.5; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 0 4px #000; }
    .panel h2 { margin: 0 0 12px; color: #8a90e6; font-size: 20px; }
    .panel textarea { width: 100%; box-sizing: border-box; background: #05061a; color: #e0e2ff; border: 2px solid #4a50a8; font: inherit; font-size: 15px; text-transform: none; letter-spacing: 0; padding: 10px; resize: none; }
    .panel button { display: block; width: 100%; margin-top: 14px; padding: 16px; font: inherit; font-size: 20px; font-weight: bold; text-transform: uppercase; background: #b7b95c; color: #111; border: 4px solid #e8ea9a; cursor: pointer; }
    .panel button:hover { background: #dcdf7a; }
    .panel .status { margin-top: 12px; color: #b7b95c; font-size: 15px; min-height: 22px; }
    .panel .small { font-size: 13px; color: #8d95b8; text-transform: none; letter-spacing: 0; }
    #settings { position: fixed; right: 10px; bottom: 10px; font-size: 12px; color: #8d95b8; display: flex; gap: 12px; align-items: center; opacity: .55; }
    #settings:hover { opacity: 1; }
    #settings input { width: 90px; }
  </style>
</head>
<body>
  <canvas id="game" width="288" height="240"></canvas>
  <div id="overlay">
    <div class="panel" id="connect-panel" style="display:none">
      <h2>Connect Your Agent</h2>
      <div class="small">Paste this into Codex. When the agent joins, the race starts.</div>
      <textarea id="connect-text" rows="3" readonly></textarea>
      <button id="connect-copy">Copy / Add to Clipboard</button>
      <div class="status" id="connect-status">Waiting for your agent to join...</div>
      <div class="small">Lobby <span id="connect-lobby"></span> &middot; Esc to cancel</div>
    </div>
  </div>
  <div id="settings">
    <label>Music <input id="vol-music" type="range" min="0" max="1" step="0.05" /></label>
    <label>SFX <input id="vol-sfx" type="range" min="0" max="1" step="0.05" /></label>
  </div>
  <script type="module" src="/bundle.js"></script>
</body>
</html>
